# Model wheel: tree + registry mapping. Rendered at docs-build time by docs/conf.py.
# src: 'lister:name' (registry entry; AGN/radio blocks use 'lister:category/name'),
#      'ssp:<regex>' (matched against tengri.list_known_ssps() names), 'param:<text>' (a build option, no registry entry).
# cite: only where the registry has no citation field. cite_status: unverified -> must be checked before merge.
version: 1
modules:
- id: stellar
  label: Stellar populations
  short: Stellar pops
  color: '#f4c247'
  groups:
  - id: sps_codes
    label: SPS codes
    models:
    - label: FSPS
      src:
      - ssp:^fsps_
      cite: Conroy, Gunn & White 2009, ApJ 699, 486; Conroy & Gunn 2010, ApJ 712, 833
    - label: BC03
      src:
      - ssp:^bc03_
      cite: Bruzual & Charlot 2003, MNRAS 344, 1000
    - label: BPASS
      src:
      - ssp:^bpss_
      cite: Eldridge et al. 2017, PASA 34, e058
    - label: MILES family (Vazdekis)
      src:
      - ssp:^(e|s)?miles_
      cite: Vazdekis et al. 2010, MNRAS 404, 1639; Vazdekis et al. 2016, MNRAS 463, 3409
      cite_status: unverified
    - label: Maraston (M05, MaStar)
      src:
      - ssp:^(m05|mastar)_
      cite: Maraston 2005, MNRAS 362, 799; Maraston et al. 2020, MNRAS 496, 2962
      cite_status: unverified
    - label: ProGeny
      src:
      - ssp:^pgny_
      cite: Robotham & Bellstedt 2024; Bellstedt & Robotham 2024, arXiv:2410.17698
  - id: isochrones
    label: Isochrones
    models:
    - label: MIST
      src:
      - ssp:(^|_)mist_
      cite: Choi et al. 2016, ApJ 823, 102
    - label: α-MIST
      src:
      - ssp:(^|_)amist_
      cite: Park et al. 2025 (α-MC) — full reference missing from the repo
      cite_status: unverified
    - label: PARSEC
      src:
      - ssp:_prsc_
      cite: Bressan et al. 2012, MNRAS 427, 127
    - label: Padova
      src:
      - ssp:_pdva_
      cite: Marigo et al. 2008, A&A 482, 883
    - label: BaSTI
      src:
      - ssp:_bsti_
      cite: Pietrinferni et al. 2004, ApJ 612, 168
    - label: BPASS stellar models
      src:
      - ssp:^bpss_
      cite: Eldridge et al. 2017, PASA 34, e058
    - label: Fuel consumption (M05)
      src:
      - ssp:^m05_
      cite: Maraston 2005, MNRAS 362, 799
      cite_status: unverified
  - id: spectral_libraries
    label: Stellar spectral libraries
    short: Spectral libs
    models:
    - label: BaSeL
      src:
      - ssp:_basel_
      cite: Westera et al. 2002, A&A 381, 524
    - label: C3K
      src:
      - ssp:_c3k_
      cite: Conroy et al. (C3K) — no published reference yet
      cite_status: unverified
    - label: MILES
      src:
      - ssp:(^miles_|_miles_)
      cite: Falcón-Barroso et al. 2011, A&A 532, A95
    - label: E-MILES
      src:
      - ssp:^emiles_
      cite: Vazdekis et al. 2016, MNRAS 463, 3409
      cite_status: unverified
    - label: sMILES (α-enhanced)
      src:
      - ssp:^smiles_
      cite: Knowles et al. 2023, MNRAS 523, 3450
      cite_status: unverified
    - label: STELIB
      src:
      - ssp:_stelib_
      cite: Le Borgne et al. 2003, A&A 402, 433
    - label: MaStar
      src:
      - ssp:^mastar_
      cite: Yan et al. 2019, ApJ 883, 175
      cite_status: unverified
  - id: imf
    label: IMF
    models:
    - label: Salpeter (1955)
      src:
      - ssp:salpeter
      cite: Salpeter 1955, ApJ 121, 161
    - label: Kroupa (2001)
      src:
      - ssp:kroupa(?!_revised)
      cite: Kroupa 2001, MNRAS 322, 231
    - label: Kroupa revised
      src:
      - ssp:kroupa_revised
      cite: Kroupa 2001 (revised form as tabulated by MILES)
      cite_status: unverified
    - label: Chabrier (2003)
      src:
      - ssp:(chabrier|imf_chab)
      cite: Chabrier 2003, PASP 115, 763
    - label: Unimodal Γ 0.3–3.5
      src:
      - ssp:unimodal
      cite: Vazdekis et al. 1996, ApJS 106, 307
      cite_status: unverified
    - label: Bimodal Γb 0.3–3.5
      src:
      - ssp:bimodal
      cite: Vazdekis et al. 1996, ApJS 106, 307
      cite_status: unverified
    - label: BPASS broken power law
      src:
      - ssp:^bpss_v2.*_imf(1\d\d)
      cite: Eldridge et al. 2017, PASA 34, e058
  - id: multiplicity
    label: Stellar multiplicity
    short: Multiplicity
    models:
    - label: Single stars
      src:
      - ssp:^(?!bpss_v2\d*_bin)
      cite: Eldridge et al. 2017, PASA 34, e058
    - label: Binary evolution
      src:
      - ssp:^bpss_v2\d*_bin_
      cite: Eldridge et al. 2017, PASA 34, e058
