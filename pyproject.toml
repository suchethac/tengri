[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-tengri"
version = "0.1.0"
description = "Differentiable SED fitting with IFT star formation history priors"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Suchetha Cooray", email = "astro.tengri@gmail.com"},
]
keywords = [
    "sed-fitting",
    "galaxies",
    "jax",
    "astronomy",
    "stellar-populations",
    "differentiable",
    "bayesian-inference",
    "information-field-theory",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "dsps>=0.4.6,<0.4.8",  # Lower bound: 0.4.6 is the first version with CosmoParams in flat_wcdm. Upper bound re-pinned 2026-06-22: the dsps 0.4.8 PyPI sdist breaks setuptools-scm version detection at install time (CI build step dies with LookupError); 0.4.7 is the last good release. The 0.4.8.dev git build works (has version metadata) — only the published 0.4.8 sdist is affected.
    "h5py>=3.0",
    "nifty8[re]>=8.5",
    "astroquery>=0.4",
    "tomli>=2.0; python_version < '3.11'",
    # JAX gates `jax_compilation_cache_max_size` behind filelock: set the cap
    # without it and JAX raises on EVERY persistent-cache read, which disables the
    # cache instead of bounding it. tengri caps the cache by default (#1507), so
    # this is required for that default to work. jax_cache.py still checks at
    # runtime and degrades to unbounded rather than broken if it is absent.
    "filelock>=3.0",
]

[project.urls]
Homepage = "https://github.com/suchethac/tengri"
Documentation = "https://suchethac.github.io/tengri/"
Repository = "https://github.com/suchethac/tengri"
Issues = "https://github.com/suchethac/tengri/issues"

[project.scripts]
tengri = "tengri.cli:main"

[project.optional-dependencies]
nuts = ["blackjax>=1.6"]
optax = ["optax>=0.2"]
# Grain-model attenuation laws (wd01_*, d03_*, hd23_*) wrap the
# dust-extinction package rather than reimplementing the profiles.
grain-dust = ["dust-extinction>=1.0"]
# Hardware-accelerator extras. JAX is installed by default with CPU support;
# these extras pull the matching jax/jaxlib build for the target backend.
# Linux x86_64 with CUDA 12: pip install -e ".[gpu]"
# macOS arm64 (Apple Silicon): pip install -e ".[metal]"
# Caveat (metal): jax-metal is experimental and known to produce numerical
# discrepancies vs CPU/CUDA on tengri's stochastic SFH path — use
# JAX_PLATFORMS=cpu for production fits until upstream stabilises.
gpu = ["jax[cuda12]>=0.4.20"]
metal = ["jax-metal>=0.1.0"]
all = [
    "blackjax>=1.6",
    "optax>=0.2",
    # Grain-model attenuation laws (wd01_*, d03_*, hd23_*) need this; without
    # it those laws raise ImportError at predict time, so "[all]" must ship it.
    "dust-extinction>=1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.5",
    # Per-test timeout safety net. Under `-n auto` a single test that
    # OOM-thrashes / hits a cold JAX compile on the CI runner can stall its
    # worker for many minutes while the others finish, leaving the whole run
    # to sit until the 25-min job timeout (a silent, undiagnosable hang). A
    # generous per-test `--timeout` turns that into a fast, named failure.
    "pytest-timeout>=2.3",
    "ruff>=0.9",
    "jupytext>=1.16",
    # JAX-native test assertions (shape, finiteness, tree-allclose, JIT/eager
    # variants). See docs/dev/testing-with-chex.md for the conventions.
    "chex>=0.1.86",
    # Tests cover optional inference paths (MAP via optax/jaxopt, NUTS via
    # blackjax) — the imports themselves are guarded inside functions, but
    # pytest still hits them via tests in test_map_*.py etc. Bundle into dev
    # so CI green. Not propagated to runtime install for end users.
    "optax>=0.2",
    "blackjax>=1.6",
    "jaxopt>=0.8",
    # Required by tests/unit/test_physical_amplitudes.py for grain-model dust
    # laws (D03/HD23/WD01). Runtime imports inside attenuation.py are guarded,
    # but the test class exercises them directly.
    "dust-extinction>=1.5",
]
crossval = [
    "bagpipes>=1.0",
    "dense_basis>=0.1.9",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.0",
    "myst-parser>=2.0",
    "nbsphinx>=0.9",
    "nbconvert>=7.0",
    "jupyter>=1.0",
    "jupytext>=1.16",
    "numpydoc>=1.5",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tengri = ["defaults.toml", "observation/data/filters_registry.json"]
"tengri.citations" = ["references.bib"]
"tengri.data.agn_bbb" = ["*.dat", "PROVENANCE.md"]
"tengri.data.agn_ext" = ["*.dat", "PROVENANCE.md"]
"tengri.data.agn_fe2" = ["*.txt", "PROVENANCE.md"]

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src", "tests"]
exclude = [
    "notebooks/archive",
    "notebooks/demonstrations",
    "notebooks/reference",
    "notebooks/tutorials",
]

[tool.ruff.lint]
select = [
    "F",      # pyflakes — unused imports/vars, redefined names
    "E", "W", # pycodestyle — basic style
    "I",      # isort — import sorting
    "UP",     # pyupgrade — modernize syntax to 3.10+
    "B",      # flake8-bugbear — common bug patterns
    "SIM",    # flake8-simplify — simplifiable constructs
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E402",   # module-import-not-at-top — needed for jax.config before imports
    "E741",   # ambiguous-variable-name — scientific code uses l, I, O
    "B905",   # zip-without-explicit-strict — not needed for JAX array ops
    "SIM108", # use-ternary-operator — readability over brevity in science code
    "RUF001", # ambiguous-unicode-character-string — Greek letters in math strings
    "RUF002", # ambiguous-unicode-character-docstring — σ, ξ, θ in docstrings
    "RUF003", # ambiguous-unicode-character-comment — scientific notation in comments
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]           # re-exports are intentional
"tests/**" = ["F841"]             # unused variables common in test fixtures
"analysis/**" = ["F841", "E501"]  # scripts: relaxed
"notebooks/**" = ["F401", "F841", "E402", "E501", "E702", "I001"]  # notebooks: exploratory, jax.config between imports
# Numpydoc math blocks contain unavoidably long LaTeX equations (.. math:: directives)
"src/tengri/components/dust/attenuation.py" = ["E501"]
"src/tengri/components/dust/_apply.py" = ["E501"]  # split from attenuation.py (#843)
"src/tengri/components/dust/laws/**" = ["E501"]  # split from attenuation.py (#843)
"src/tengri/components/igm/igm.py" = ["E501"]
"src/tengri/components/nebular/_shared.py" = ["E501"]
"src/tengri/components/sfh/mean_sfh.py" = ["E501"]
"src/tengri/components/sfh/psd_models.py" = ["E501"]
"src/tengri/components/stellar/sfh/mean_sfh.py" = ["E501"]
"src/tengri/components/stellar/sfh/psd_models.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["tengri"]
combine-as-imports = true

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run is the PR-gating fast tier, in parallel. The heavy trees
# (tests/inference, tests/integration) are auto-marked `slow` in conftest and
# deselected here, matching the CI split where they run as a separate,
# schedule/label-gated job. To run them: `-m 'not crossval'` (all) or `-m slow`.
#
# `--dist=loadfile` (not the default `load`): the SSP grids are session-scoped
# fixtures, so keeping a whole file on one worker pays that load once per
# worker instead of once per scattered test.
#
# `benchmark` is deselected because it asserts on wall-clock ratios at the
# ~30-60 us scale, which scheduler noise swamps once `-n auto` puts a dozen
# workers on the same cores. The guard is still worth having, so CI runs it
# serially: `pytest -m benchmark -n 0`.
addopts = "--tb=short -m 'not crossval and not slow and not benchmark' -n auto --dist=loadfile"
markers = [
    "slow: heavy end-to-end tests (inference/integration trees); excluded from the default run",
    "network: test genuinely exercises a network path; exempt from the conftest network guard (#1546)",
    "crossval: cross-validation tests against community SED codes (bagpipes, etc.)",
    "benchmark: asserts a wall-clock ratio; run serially (`-m benchmark -n 0`), never under -n auto",
    "conservation: energy/mass/photon balance across a transformation",
    "bounds: non-negativity, monotonicity, unit-interval, credible-interval ordering",
    "limit: zero-input recovers the analytical answer (tau=0 -> intrinsic, etc.)",
    "regression_paper: numerical match to a published equation/table (cite in docstring)",
    "regression_bug: frozen output for a previously-fixed bug (cite ADR/commit)",
    "gradient: jax.grad sanity + finite-difference checks",
    "contract: public-API surface, deprecation alias, registry round-trip",
    "unit: fast isolated test, no data files or grids",
    "integration: exercises multiple components end-to-end",
    "physics: validates output against a physical equation or limit",
]

[tool.jupytext]
formats = "ipynb,py:percent"
