name: diag-1154

# Disposable. Runs ONLY on diag/** branches so it cannot touch main or any PR.
on:
  push:
    branches: ["diag/**"]

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need bff0a3d00 to recover the OLD SSP blob
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DSPS: 0.4.7

      # Recover the SSP exactly as #1146/#1151 shipped it — before #1153 replaced it.
      - name: recover the pre-#1153 SSP
        run: |
          git show bff0a3d00:data/fsps_prsc_miles_chabrier.h5 \
            > data/_old_fsps_prsc_miles_chabrier.h5
          ls -l data/fsps_prsc_miles_chabrier.h5 data/_old_fsps_prsc_miles_chabrier.h5

      - name: "attribution: cache collision (#1156) or broken SSP (#1153)?"
        env: {JAX_PLATFORMS: cpu}
        run: python tools/diag_1154.py
