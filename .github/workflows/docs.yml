name: Deploy Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# dsps sdists build via setuptools-scm, which raises in the fresh pip
# build-isolation env without a .git checkout; stamp a version so the build
# succeeds (matches tests.yml; see #798).
env:
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DSPS: "0.4.7"
  # Pin JAX for every pip install in this workflow (.github/ci-constraints.txt).
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/ci-constraints.txt

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r docs/requirements.txt

      - name: Install pandoc
        run: sudo apt-get install -y pandoc

      # Verify every registered component appears in the published reference.
      # This guard needs the docs extra (sphinx-gallery) to execute docs/conf.py.
      - run: python tools/check_component_page.py
      # A documented listing is the first code a reader copies, and nothing ran
      # them: one carried eight defects (names that do not exist, an inverted
      # Observation/Data split) that every check missed (#2430). This executes
      # every SEDModel.build(...) listing under docs/ against the committed SSP
      # fixture and checks that the model it builds predicts finite, positive
      # photometry. Each listing cold-builds a model (30-60 s), so the gate is
      # minutes, not seconds: it lives with the docs build rather than in the
      # per-PR smoke job, and runs whenever the docs do.
      - run: python tools/check_build_listings.py

      # Warnings are errors. The docs are the API reference (docs/api/*.rst are
      # autodoc stubs, so docstrings ARE the published pages), and a Sphinx
      # warning there means something is actually wrong: LaTeX eaten by a
      # non-raw docstring, a registry documenting itself as builtin dict(),
      # markup that silently swallows the text after it. --keep-going reports
      # every warning in one run instead of stopping at the first.
      - name: Build documentation
        run: cd docs && make html SPHINXOPTS="-W --keep-going"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
