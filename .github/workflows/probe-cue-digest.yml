name: probe-cue-digest
# Temporary (not for merge): records the x64-off Cue spectrum digest per runner CPU, with
# and without the components shard's restored JAX compile cache.
on:
  pull_request:
    paths: [".github/probe/**", ".github/workflows/probe-cue-digest.yml"]
permissions:
  contents: read
env:
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DSPS: "0.4.7"
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/ci-constraints.txt
  JAX_PLATFORMS: cpu
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cache: ["restored", "disabled"]
        i: [1, 2, 3, 4, 5]
    env:
      TENGRI_DISABLE_JAX_CACHE: ${{ matrix.cache == 'disabled' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/ci-constraints.txt
      - run: pip install -e ".[dev]"
      - id: jaxver
        run: echo "v=$(python -c "from importlib.metadata import version; print(version('jax'))")" >> "$GITHUB_OUTPUT"
      - id: week
        run: echo "w=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.cache == 'restored'
        id: jax_cache
        with:
          path: ~/.cache/tengri_jax_cache
          key: tengri-jax-test-components-${{ hashFiles('pyproject.toml') }}-jax${{ steps.jaxver.outputs.v }}-${{ steps.week.outputs.w }}
          restore-keys: |
            tengri-jax-test-components-${{ hashFiles('pyproject.toml') }}-
            tengri-jax-test-components-
      - run: |
          echo "CACHE arm=${{ matrix.cache }} matched=${{ steps.jax_cache.outputs.cache-matched-key }}"
          du -sh ~/.cache/tengri_jax_cache 2>/dev/null || echo "no jax cache dir"
      - run: python .github/probe/cue_digest.py
