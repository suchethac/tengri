name: Docs Preview (PR)

# Build docs on every PR + upload as a downloadable artifact, plus post
# a comment on the PR with the artifact link so reviewers can preview
# rendered HTML without merging.
#
# Mirrors docs.yml but skips GitHub Pages deployment (PRs don't get a
# live URL — the artifact is the deliverable).

on:
  pull_request:
    paths:
      - "docs/**"
      - "examples/**"
      - "src/tengri/**"
      # The spine pages are GENERATED at build time: `make html` depends on
      # spine-ipynb, which re-merges each docs/spine/*.ipynb source from
      # notebooks/<slug>.py. So a notebooks/ edit changes the published site,
      # and a change to the generator changes every spine page -- neither is
      # under docs/, and without these both shipped with no preview build.
      - "notebooks/**"
      # The reproduction pages are NOT generated at build time -- the committed
      # docs/reproduction/<slug>.ipynb is served as-is (CONTRACT §8). So a
      # reproduction/ edit reaches the site only via its re-copied docs/ twin,
      # and a PR touching one without the other is exactly what the preview is
      # for. Listed for the same reason as notebooks/ above, one tree later.
      - "reproduction/**"
      - "scripts/sync_spine_notebooks_for_docs.py"
      - ".github/workflows/docs-preview.yml"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pull-requests: write

# Cancel an in-flight preview build when a new commit lands on the
# same PR — only the latest matters.
concurrency:
  group: docs-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# dsps sdists build via setuptools-scm, which raises in the fresh pip
# build-isolation env without a .git checkout; stamp a version so the build
# succeeds (matches tests.yml; see #798).
env:
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DSPS: "0.4.7"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pandoc
        run: sudo apt-get install -y pandoc

      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r docs/requirements.txt

      - name: Build documentation
        # CI=true triggers plot_gallery=False inside docs/conf.py — the
        # build relies on PNGs committed under docs/auto_examples/<group>/
        # images/. The _inject_missing_image_directives hook in conf.py
        # injects .. image:: directives into any RST that has the PNG on
        # disk but lacks the directive (sphinx-gallery only emits it when
        # it executes the script).
        env:
          CI: "true"
        run: cd docs && make html SPHINXOPTS="-W --keep-going"

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-preview-pr-${{ github.event.pull_request.number }}
          path: docs/_build/html
          retention-days: 14

      - name: Post artifact link to PR
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifactsUrl = `${runUrl}#artifacts`;
            const marker = "<!-- docs-preview-bot -->";
            const body = [
              marker,
              "### 📚 Docs preview built",
              "",
              `**Artifact:** [\`docs-preview-pr-${context.issue.number}\`](${artifactsUrl}) (retained 14 days)`,
              "",
              "Download the zip, unpack, and open `index.html` in a browser to review.",
              "",
              `<sub>Built from ${context.sha.slice(0, 8)} • [run log](${runUrl})</sub>`,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
