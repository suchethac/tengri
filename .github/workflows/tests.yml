name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Nightly slow-tier run at 04:00 UTC (mid-afternoon Tokyo).
    - cron: "0 4 * * *"
  workflow_dispatch:

# Cancel older runs of this workflow on the same ref when a new push lands.
# Saves compute when commits land back-to-back.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install "ruff==0.15.6"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python tools/check_param_prefixes.py
      - run: python tools/check_test_markers.py
      - run: pytest tests/components/sps/test_alpha_fe.py tests/components/stellar/test_stellar_skeleton.py -q --no-header

  test:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Match the pre-rehome scope: fast tests only.
      # tests/integration/ and tests/crossval/ are gated; the new
      # physics-first tree (components/, contract/, inference/,
      # physics/, regression/) sits alongside the legacy tests/unit/
      # subdirs and runs in the same fast-suite scope.
      # tests/inference/ is excluded from fast CI: many files do real
      # MAP/VI/MCMC fits and individually push runtime past 15 min.
      # Re-introduce via a slow-tier job in a follow-up PR.
      #
      # Two missing-fixture files remain skipped; the three numerical
      # / autodiff failures the rehome surfaced were fixed in the same
      # PR that removed the --deselect lines.
      #
      # pytest-xdist `-n auto` runs tests in parallel across all CPU cores on
      # the GitHub runner (typically 4 vCPUs). Gives ~2-3x wall-clock speedup
      # on the ~5800-test fast suite.
      - run: |
          pytest tests/components tests/contract tests/physics tests/regression -q \
            -n auto \
            --ignore=tests/crossval \
            --ignore=tests/regression/paper/test_draine2021_pah_loader.py \
            --ignore=tests/regression/synthesizer_parity/test_nebular_continuum.py \
            --ignore=tests/regression/synthesizer_parity/test_nebular_fesc.py
        timeout-minutes: 15

  # Sampler-heavy inference tests (NUTS, Pathfinder, VI, MCLMC, etc.).
  # Run on:
  #   - nightly schedule
  #   - manual workflow_dispatch
  #   - PRs labeled `run-slow-tests`
  # Skip on regular push/PR to keep fast feedback under 15 min.
  slow:
    runs-on: ubuntu-latest
    # Own concurrency group: do NOT inherit the workflow-level
    # `cancel-in-progress: true` (which kills slow whenever main moves).
    # `cancel-in-progress: false` means newer slow triggers queue behind
    # an existing one — slow always runs to completion, never aborted by
    # an unrelated main push. See issue #160.
    concurrency:
      group: tests-slow-${{ github.ref }}
      cancel-in-progress: false
    if: |
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-slow-tests'))
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest tests/inference tests/integration -q --ignore=tests/crossval
        timeout-minutes: 40
