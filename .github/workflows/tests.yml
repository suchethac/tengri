name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Nightly slow-tier run at 04:00 UTC (mid-afternoon Tokyo).
    - cron: "0 4 * * *"
  workflow_dispatch:

# Cancel older runs of this workflow on the same ref when a new push lands.
# Saves compute when commits land back-to-back.
#
# `labeled` PR events get a UNIQUE group (run_id) so they never cancel the real
# push / opened / synchronize run — a label add must not abort an in-flight
# suite. (Their jobs also skip via the per-job `if:` below, so the unique-group
# run is a near-instant no-op.) Every other event shares one group per ref so a
# newer commit supersedes the older run.
concurrency:
  group: tests-${{ github.ref }}-${{ (github.event_name == 'pull_request' && github.event.action == 'labeled') && github.run_id || 'commit' }}
  cancel-in-progress: true

# Skip the heavy jobs on bare `labeled` PR events. GitHub fires one `labeled`
# webhook PER label added, so labelling a PR with N labels used to spawn N
# duplicate workflow runs that immediately cancelled each other under
# `cancel-in-progress` (and occasionally killed the surviving run mid-suite).
# Only the `slow` job cares about labels (`run-slow-tests`); everything else
# should run on push / opened / synchronize / reopened, not on label adds.
jobs:
  lint:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'labeled' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install "ruff==0.15.6"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: python tools/add_spdx_headers.py --check

  # Static security scan + dependency vulnerability check. Informational
  # for now (continue-on-error) — surfaces findings in the PR check UI
  # without blocking. Promote to required once the baseline is clean.
  security:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'labeled' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install bandit pip-audit
      - name: Static security scan (bandit, high severity)
        run: bandit -r src/ -ll
        continue-on-error: true
      - name: Install for dependency audit
        run: pip install -e .
      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit --disable-pip
        continue-on-error: true

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'labeled' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python tools/check_param_prefixes.py
      - run: python tools/check_test_markers.py
      - run: pytest tests/components/sps/test_alpha_fe.py tests/components/stellar/test_stellar_skeleton.py -q --no-header

  test:
    runs-on: ubuntu-latest
    needs: smoke
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'labeled' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Fast PR feedback: NO coverage instrumentation (cov adds ~30-50% wall
      # clock) and NO JAX disk-cache (it never warmed — cancelled runs don't
      # save it — and added restore/save overhead). Coverage runs separately on
      # push/nightly in the `coverage` job below. tests/inference + integration
      # are gated to the slow tier; crossval + the data-only nebular/draine
      # parity files are ignored (they skip without their grids).
      #
      # pytest-xdist `-n auto` parallelises across the runner's CPUs (≈4 vCPU).
      - run: |
          pytest tests/components tests/contract tests/physics tests/regression -q \
            -n auto \
            --ignore=tests/crossval \
            --ignore=tests/regression/paper/test_draine2021_pah_loader.py \
            --ignore=tests/regression/synthesizer_parity/test_nebular_continuum.py \
            --ignore=tests/regression/synthesizer_parity/test_nebular_fesc.py
        timeout-minutes: 25

  # Full-suite coverage → Codecov, WITHOUT slowing PR feedback. Runs on
  # push-to-main, the nightly schedule, and manual dispatch — not on PRs.
  coverage:
    runs-on: ubuntu-latest
    needs: smoke
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: |
          pytest tests/components tests/contract tests/physics tests/regression -q \
            -n auto \
            --cov=src/tengri --cov-report=xml --cov-report=term:skip-covered \
            --ignore=tests/crossval \
            --ignore=tests/regression/paper/test_draine2021_pah_loader.py \
            --ignore=tests/regression/synthesizer_parity/test_nebular_continuum.py \
            --ignore=tests/regression/synthesizer_parity/test_nebular_fesc.py
        timeout-minutes: 35
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  # Sampler-heavy inference tests (NUTS, Pathfinder, VI, MCLMC, etc.).
  # Run on:
  #   - nightly schedule
  #   - manual workflow_dispatch
  #   - PRs labeled `run-slow-tests`
  # Skip on regular push/PR to keep fast feedback under 15 min.
  slow:
    runs-on: ubuntu-latest
    # Own concurrency group: do NOT inherit the workflow-level
    # `cancel-in-progress: true` (which kills slow whenever main moves).
    # `cancel-in-progress: false` means newer slow triggers queue behind
    # an existing one — slow always runs to completion, never aborted by
    # an unrelated main push. See issue #160.
    concurrency:
      group: tests-slow-${{ github.ref }}
      cancel-in-progress: false
    if: |
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-slow-tests'))
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest tests/inference tests/integration -q --ignore=tests/crossval
        timeout-minutes: 40
