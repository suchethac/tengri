name: Tests

on:
  push:
    branches: [main]
  # No `branches:` filter — this workflow fires for a PR against ANY base.
  #
  # It used to read `branches: [main]`, so a PR stacked on another branch ran
  # none of this. Not hypothetical: #1806 (the nebular band integration) and
  # #1810 (its correction, which added
  # `tests/contract/test_precomp_channel_drift.py` and the bound pinning the
  # known `single_component` defect) both merged into
  # `worktree-fix-1738-precompute-state` having run exactly ONE check — `build`,
  # from docs-preview.yml, which is the only workflow here with no branch
  # filter. A comparable PR against `main` ran twenty. So the tests written to
  # pin an acknowledged defect were themselves never executed, and the stack's
  # first real verdict arrived only when it retargeted to `main` — bundled, and
  # long after the commit anyone would have to bisect to.
  #
  # Firing is not the same as running everything: the `tier` job below decides
  # how much of the suite a given base earns, and says so when it withholds.
  # `tools/check_ci_pr_coverage.py` (lint job) fails the build if this filter
  # comes back.
  pull_request:
    # Pull requests run a CHEAP tier by default: lint, security, smoke and the
    # `physics` and `regression-c` shards, plus the four docs-scope shards
    # when the diff touches docs/, notebooks/, reproduction/ or a top-level
    # *.md. The label `full-tests` runs the whole suite instead, and so does a
    # diff that touches the CI machinery itself (see `gallery-changes`).
    #
    # THE TRADE-OFF, STATED PLAINLY: a green cheap-tier pull request has not run
    # the shards it withheld. A failure in one of them is caught on `main`
    # right after the commit lands, because every push to `main` runs the full
    # suite; it is not caught before the merge unless the author adds
    # `full-tests`. (GitHub's merge queue would have closed that gap and is not
    # available on this repository.)
    #
    # The scope is computed from the PR's CURRENT label set, which is why
    # `labeled` and `unlabeled` are triggers:
    #
    #   * adding `full-tests` starts the full run it asks for;
    #   * removing it returns the PR to the cheap tier;
    #   * any OTHER label event re-computes the same scope the PR already had
    #     and re-runs it (the label burst CLAUDE.md mandates collapses to one
    #     run through the concurrency group below). It never escalates to the
    #     full suite, and `slow` / `crossval` stand down on a label event that
    #     is not their own label (see their `if:`).
    #
    # Why every label event runs a real verdict rather than a no-op: the newest
    # check suite wins when branch protection resolves a required context
    # (#1856), so a label-event run that skipped its jobs would publish
    # `skipped` over the real result and block the merge, and one that passed
    # them without running would publish an approval nothing earned. Re-running
    # the same scope costs a few minutes and publishes the true answer.
    #
    # `ready_for_review` is here because a draft pull request withholds the
    # test matrix (see `gallery-changes`): marking it ready must start the run
    # that was withheld.
    #
    # `edited` is here for base retargeting: the scope and the stand-down of a
    # stacked PR both depend on `github.base_ref`, so changing the base from
    # another branch to `main` (or back) must re-run the gate. GitHub fires
    # `edited` for a title or body change too. Such an event leaves the scope
    # exactly as it was (the gate recomputes it from the same diff and labels)
    # and re-runs it for real, for the same newest-suite reason as a label
    # event; the gate logs whether the base changed.
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
  schedule:
    # Nightly slow-tier run at 04:00 UTC (mid-afternoon Tokyo).
    - cron: "0 4 * * *"
  workflow_dispatch:

# Supersede stale runs -- but never on `main`.
#
# **Every push to `main` runs the FULL suite, and no push run is cancelled.**
# Pushes share one fixed group (`tests-main-push`), so a run in progress always
# finishes and its verdict is real. Cancelling a predecessor is how red commits
# used to land on `main` unjudged, which is why the push group never cancels.
# Never cancelling has a cost, bounded by coalescing (see the block below): at
# most one push run is pending at a time, and a newer push replaces an older
# pending one.
#
# What makes that affordable is that pull requests run the cheap tier. The
# full suite is ~360 runner-minutes per run against ~26 for the cheap tier, and
# at ~34 merges/day a pull-request population that also ran the full suite on
# every push saturated the 20-job ceiling and put queue latency at 7-14 h; a
# verdict that arrives half a day after the commit is the red-commit failure
# again. With the cheap tier on PRs the full suite runs on pushes to `main`
# only, and a burst of merges costs at most two of them (and again for a PR
# that asks for it with `full-tests`).
#
# The nightly `schedule` run is the whole suite -- `test`, `coverage`, `slow`,
# `crossval` -- on the tip of `main`, and `nightly-alarm` opens an issue when it
# is red.
#
# Concurrency by event:
#
#   push         ONE fixed group (`tests-main-push`), never cancelled. Pushes
#                to `main` are COALESCED: the run in progress always finishes,
#                and GitHub keeps at most one pending run, replacing an older
#                pending run with the newer. A burst of merges therefore costs
#                at most two full runs (the one in flight and the newest
#                commit) instead of one per merge. Every landed commit is still
#                covered by the next completed verdict: a failing verdict
#                covers the range since the last completed run, so bisect
#                within that range to find the commit.
#   the rest     keyed on `github.event_name`, so a newer event of the SAME kind
#                supersedes the older one -- a PR synchronize cancels the prior
#                PR run, which is where the real compute saving lives. Keying on
#                the event name also keeps a nightly `schedule` run and a `push`
#                run from sharing a group on `main` (both resolve to the same
#                `github.ref`) and cancelling each other mid-suite.
#
# A `labeled` / `unlabeled` / `edited` PR event shares the PR group with
# `synchronize`, so the burst of events one labelling produces collapses to a
# single run, and the surviving run re-derives its scope from the final label
# set.
concurrency:
  group: >-
    ${{ github.event_name == 'push' && 'tests-main-push'
      || format('tests-{0}-{1}', github.ref, github.event_name) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# Supply a version for the `dsps` build. The published dsps sdists use
# setuptools-scm, which (in the fresh pip build-isolation env) raises
# `LookupError: unable to detect version` when built without a .git checkout —
# turning the install step red for every dsps release. Pretending a version lets
# the sdist build; it is purely a build-time stamp and does not change the
# resolved dependency (pinned to <0.4.8 in pyproject.toml). See #798.
env:
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DSPS: "0.4.7"
  # Pin JAX for every pip install in this workflow (.github/ci-constraints.txt).
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/ci-constraints.txt
  # Arm the whole-file-skip guard (tests/conftest.py, #1615/#1946): a file whose
  # every collected test skips is inert coverage and fails the session. The guard
  # scopes itself to the fast-tier trees and excludes integration/crossval, so
  # arming it workflow-wide is safe for the data-gated jobs.
  TENGRI_GUARD_FULLY_SKIP: "1"

# CI tiers, by event (`gallery-changes` computes the scope; `ci-ok` checks it):
#
#   pull_request   cheap by default: lint, security, smoke, `physics`,
#                  `regression-c`, plus `contract`, `components`, `regression-a1`,
#                  `regression-a2`, `regression-a3`, `regression-d` when the diff touches docs/, notebooks/,
#                  reproduction/ or a top-level *.md (scope cheap / cheap-docs).
#                  A docs-only diff runs just those six (scope docs). The label
#                  `full-tests` runs the full suite (scope all), and so does a
#                  diff touching the CI machinery (workflows, ci_ok.py,
#                  ci_split_paths.py, pyproject.toml, any conftest.py). A draft
#                  runs the gates only (scope none).
#   push (main)    the FULL suite after the commit lands (scope all: all eleven
#                  shards and the gallery). A failure in a shard the cheap
#                  tier skipped is caught here, right after landing. Runs are
#                  coalesced (see Concurrency), so a verdict covers every
#                  commit since the last completed run.
#   schedule       the whole suite nightly, plus coverage, slow and crossval.
#
# The test matrix is DYNAMIC: `gallery-changes` builds it from the scope, so a
# shard the scope withholds never takes a runner. `ci-ok` compares the shards
# that ran against the set the scope requires.
#
# THE FOUR ALWAYS-RUN GATES MUST NOT STAND DOWN ON A `labeled` EVENT.
#
# `tier`, `lint`, `security` and `smoke` are `ALL_PR_JOBS` in
# `tools/check_ci_pr_coverage.py`: "jobs that run for EVERY pull request,
# whatever its base". A `labeled` run whose jobs are skipped by `if:` still
# PUBLISHES a check run per job, with conclusion `skipped`; those runs live in a
# check suite created AFTER the real one, and branch protection resolves a
# required context to the newest suite that carries that name. A `skipped` run
# does not satisfy a required context, so the result is `mergeStateStatus:
# BLOCKED` with `statusCheckRollup: SUCCESS` -- green to every human-facing
# view, permanently unmergeable (measured on PR #1856 against PR #1852 as the
# control). `check_ci_pr_coverage.py` asserts the guard stays off them, because
# reintroducing it is invisible until a merge is attempted. The same reasoning
# is why `gallery-changes` and `test` run on label events too (see `types:`).
jobs:
  # Announces what this run does NOT cover. The #1806/#1810 failure was not that
  # a stacked PR ran less — it was that a green tick on a stacked PR looked
  # exactly like a green tick on a full run. A run that covers less must say so.
  #
  # NOTHING DEPENDS ON THIS JOB, deliberately. An earlier revision had it publish
  # a `full` output that `test` and `gallery-changes` consumed via `needs:`. That
  # put an extra runner acquisition on the critical path of the 19-minute test
  # matrix in order to compute a boolean that `if:` can evaluate for free, and
  # this repo routinely has 40+ workflow runs in flight — the first run of that
  # revision sat with `tier` queued while `smoke`, `lint` and `security` had all
  # finished, holding back the entire matrix behind a two-minute job that could
  # not get a runner. The heavy jobs now test `github.base_ref` inline and start
  # the moment `smoke` clears; this job just narrates, in parallel, blocking
  # nothing.
  #
  # The condition is therefore written in three places, which is exactly the
  # duplication that let the old branch filter drift out of view — so
  # `tools/check_ci_pr_coverage.py` asserts every full-tier job actually carries
  # it, rather than trusting anyone to keep them in step.
  tier:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Say what this run covers
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            {
              echo "## Full CI tier (push to main)"
              echo
              echo "**Ran:** lint, security, smoke, all eleven \`test\` shards, and the gallery"
              echo "when the pushed commits touched a gallery input."
              echo
              echo "Pull requests run the cheap tier, so this is where a failure in a shard"
              echo "the cheap tier skipped is caught: right after the commit landed."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$EVENT_NAME" != "pull_request" ]; then
            {
              echo "## Full CI tier"
              echo
              echo "The nightly and manual runs execute every test shard, the gallery,"
              echo "coverage, the slow tier and crossval."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$BASE_REF" = "main" ]; then
            {
              echo "## Pull request CI tier"
              echo
              echo "An unlabeled pull request runs the cheap tier: lint, security, smoke,"
              echo "\`physics\`, \`regression-c\`, plus the docs-scope shards when the diff"
              echo "touches docs, notebooks, reproduction or a top-level markdown file. A"
              echo "pull request labeled \`full-tests\`, or one that touches the CI machinery,"
              echo "runs every shard. A draft runs the gates only. The \`gallery-changes\` job"
              echo "prints the scope it chose."
              echo
              echo "A green cheap-tier pull request is not a full verdict. A failure in a"
              echo "shard it skipped is caught on \`main\` right after the commit lands, or"
              echo "before the merge if you add the label \`full-tests\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Partial CI tier"
            echo
            echo "This PR targets \`$BASE_REF\`, not \`main\`."
            echo
            echo "**Ran:** lint, security, smoke."
            echo
            echo "**Did NOT run:** the \`test\` shards (including \`contract\`, which"
            echo "holds the precompute drift guard) or the gallery."
            echo
            echo "A green result here is therefore **not** a full verdict. The suite"
            echo "runs when this PR is retargeted to \`main\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Partial CI tier::Base is $BASE_REF, not main. The test shards and gallery did not run; a green result here is not a full verdict."

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install "ruff==0.15.6" "jupytext>=1.16"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: python tools/add_spdx_headers.py --check
      - run: python tools/check_british_spelling.py
      # CLAUDE.md says its instructions OVERRIDE default behavior and must be
      # followed exactly, so a path in it that does not exist is a standing
      # instruction to look in the wrong place. `area:examples` pointed at
      # `docs/examples/` — no such directory; the gallery is at `examples/`.
      # check_doc_examples.py resolves symbols and never looked at paths.
      # Stdlib-only, same as the guards around it.
      - run: python tools/check_claude_md_paths.py
      # A test may not turn an arbitrary failure into a skip. The legitimate
      # idiom is `except FileNotFoundError: pytest.skip(...)` -- a class that
      # can only mean the environment lacks a file. A wider handler also
      # catches a real regression, and then the test reports SKIPPED (which
      # reads as "not applicable here") while the code is broken. Five
      # CompileCache tests had never run for exactly this reason: their fixture
      # passed a dict where an Observation belongs, and `except Exception`
      # relabelled the TypeError "Could not create minimal model". Stdlib-only.
      - run: python tools/check_test_skip_handlers.py
      # A module-scope numeric table reaches JAX only through device_table()
      # (#2271). A jnp array at module scope is a device buffer whose dtype is
      # fixed at import (jax-mps cannot even import the package); a plain numpy
      # table reused across traces under a different x64 state comes back with
      # the dtype of its FIRST conversion (JAX memoizes by object identity), so
      # the conversion has to happen at the use with an explicit dtype. The
      # runtime half is the census in tests/regression/precision. Stdlib-only.
      - run: python tools/check_host_tables.py
      # The verification protocol is where README sends anyone asking what is
      # safe to use for science, and its Test File column IS the evidence. It
      # cited eight crossval tests; all eight were absent, every row read
      # PENDING, and 56 real crossval files sat beside it under other names —
      # so the ledger understated the project until someone re-typed the
      # filenames (#1725). Resolves paths only: it cannot tell you a cited test
      # runs, which is why the protocol carries a NOT RUN status. Stdlib-only.
      - run: python tools/check_verification_protocol_paths.py
      # The repo is public, so a committed `/Users/<someone>/...` ships. Both
      # sources are generated output nobody re-reads: sphinx-gallery bakes the
      # console into docs/auto_examples/*.rst, so a gallery regenerated from a
      # worktree captures that worktree's path (#1783 replaced 792 of them, and
      # it had happened before), and three HDF5 grids carried a home directory
      # in a provenance attribute from the day they were built. Matches the
      # PATH form, never the username: halos.as.arizona.edu/suchethacooray/ is
      # the public data mirror download_ssp() needs, and scrubbing it would
      # break installation. Reads data files as raw bytes because rewriting an
      # HDF5 attribute leaves the old string in the file's freed space, where
      # any check going through h5py reports clean. Stdlib-only.
      - run: python tools/check_no_local_paths.py
      # A ratchet on repository growth. #1817 declined the history rewrite --
      # public since 2026-03-21 with two third-party forks, so renumbering every
      # commit SHA buys clone size and nothing else -- which leaves the
      # accumulation rate as the part that compounds (~80 MB in four days).
      # Measured growth vector: excluding data/, the ten largest tracked files
      # are all .ipynb between 4 and 9 MiB, almost entirely base64 PNG.
      # Rebuilding five of them from their jupytext mirrors in #1820 removed
      # 4.9 MiB without touching a line of code. Existing offenders are
      # inventoried and may stay but not grow; data/ gets its own higher limit
      # for the SSP grids. Stdlib-only.
      - run: python tools/check_file_sizes.py
      # Git applies ignore rules only to UNTRACKED files, so a file added before
      # a rule keeps working while the repository declares its directory
      # disposable -- and every consequence is silent. 41 tracked files were in
      # that state: `git add -A` would not have recovered any of them after a
      # delete-and-re-add, ruff skips such files inside a git checkout (#1598 hid
      # two real defects that way), and 28 duplicate filter curves sat there,
      # twenty of which made data/filters/ unreachable for the gallery (#1857).
      # Stdlib-only.
      - run: python tools/check_tracked_not_ignored.py
      # tengri implements published models and validates against the reference
      # codes; it does not port or copy their source. The wording drifted back
      # twice after being swept by hand, so it is pinned here. Stdlib-only.
      - run: python tools/check_reimplementation_language.py
      # `check_doc_examples` resolves symbols and `check_claude_md_paths` resolves
      # paths; a CITATION is prose, so nothing checked it. The NLR line template
      # was cited three times, three different ways, one of them a title invented
      # against a bibcode that belongs to a dwarf-spheroidal kinematics paper —
      # so the template could not be checked against its source, and when a
      # doublet ratio in it disagreed with atomic physics the published data got
      # "corrected" to satisfy a test (#1752). This cannot verify a bibcode is
      # right (that needs the network) but it enforces that the repo does not
      # disagree with itself, which is what actually happened. Stdlib-only.
      - run: python tools/check_citation_consistency.py
      # The guard above compares citations to EACH OTHER, so it cannot see one
      # that is wrong the same way everywhere: Feltre+2016 was cited three times
      # under a DOI belonging to a planet-scattering paper, self-consistently.
      # references.bib is the curated record and was right about Cue the whole
      # time, but nothing bound docstrings to it -- every bib consumer is a
      # runtime path. This compares citations to THE RECORD. It found Vanden
      # Berk+2001 cited in `blr.py` under the correct DOI with the title of a
      # different paper ("The SDSS Quasar Catalog"), which a coverage-only check
      # would have shipped. Backlogs pinned and ratcheting. Stdlib-only.
      - run: python tools/check_citation_bib_coverage.py
      # The two guards above police citations inside `src/`. Nothing policed the
      # page that exists to credit the people whose work this runs on:
      # references.bib held 105 entries and docs/citation.md acknowledged about
      # 15, so every isochrone set, every stellar library, all three IMFs, all
      # ten attenuation laws and thirteen of fourteen AGN papers were absent
      # from the published acknowledgements. registry.py calls the bib "the
      # single source of truth" and the docs were never bound to it, so the page
      # also cited the Ray Tracing Sampler under an arXiv id the record
      # contradicts. Requires the first author's surname AND the year within 120
      # characters on the page — checking the two independently would pass a
      # page that says "Conroy" in one section and "2009" in another, which is
      # the vacuous census this repo has shipped before. Derives both halves
      # from the bib's own short/year fields, so it has no list to rot.
      # Stdlib-only.
      - run: python tools/check_citation_docs_coverage.py
      # A warning that renders a computed number and discards it forces every
      # consumer to regex-parse prose for a value the format spec already
      # rounded: `{frac:.0%}` made "69%" mean anything in 0.685-0.695, and the
      # mock builder that needed it recorded 0.0 for every galaxy while the
      # warnings fired (#1645). AST, not grep — `warnings.warn(` and its
      # f-string are on different lines, so a line-based scan of this same tree
      # reports zero hits. Stdlib-only, same as the guards around it.
      - run: python tools/check_warning_payloads.py
      # Removing a public spelling means rewriting every call site, and that
      # sweep's census is whatever the author happened to grep. #1720 removed
      # `stellar=` and reported "six notebooks" migrated -- six under
      # `notebooks/`, none under `reproduction/`, which has six of its own.
      # Five died on the removed spelling and stayed dead, because the only
      # PR-gated checks over `reproduction/` hash the committed PNGs, which keep
      # matching while the source that produced them no longer runs
      # (#1776-#1781). AST, not grep: the changelog and the migration guide name
      # every removed spelling on purpose, and a checker that fails on its own
      # documentation gets silenced. Stdlib-only, same as the guards around it.
      - run: python tools/check_removed_apis.py
      # Every test tree must be reachable from some job's path list. The matrix
      # below is explicit, so a directory it stops naming goes dark silently —
      # which is what happened to `tests/unit`. Stdlib-only by design: this job
      # installs ruff and nothing else.
      - run: python tools/check_test_paths_covered.py
      # A `Path(__file__).parents[N]` counted wrong lands on a directory holding
      # no grids, so the `if not (_DATA / grid).exists(): skip` built on it is
      # permanently true and the tests are dark on every machine. Four separate
      # miscounts across eight files kept 27 tests from ever running, including
      # two whose grids are tracked in git. Stdlib-only, same as above.
      - run: python tools/check_test_data_paths.py
      # A test can pass because the bad case slipped through the predicate rather
      # than because the good case was verified. #2100 pinned a gradient `isfinite`
      # and a gradient of exactly ZERO is finite, so the identically-zero float32
      # photometry gradient sailed through the only coverage that could have caught
      # it. #2178 is the mirror: seam checks pinned the gradient `!= 0.0`, and
      # `nan != 0.0` is True, so a NaN satisfied a non-zero assertion and shipped on
      # the default spectroscopy path. Finite AND non-zero, together — never either
      # alone. AST-based, not a regex over source text (5d08a293e, #2108).
      - run: python tools/check_gradient_assertions.py
      # `Fitter._build_data_args` reads its optional observation channels with
      # `getattr(obs, "line_ratios", None)` — correct against a real model,
      # unsatisfiable against a bare MagicMock, whose every attribute
      # auto-vivifies so the None default is unreachable and each guard passes.
      # A photometry-only stub therefore claims line fluxes, line ratios and
      # spectral indices; #1942's stub published nine phantom data_args keys and
      # four likelihood channels where one was intended. Harmless until the
      # eager channel-scale pre-check (#1495) started evaluating every channel
      # at loss-build time, at which point it became four hard failures. This is
      # the fail-open half of the class — a stub cannot be asked what it
      # supports, because the answer is always yes — so the rule is that a mock
      # model must declare what it LACKS. AST, not grep: the mock is built in a
      # fixture and consumed by a `Fitter(...)` call in another function.
      # Stdlib-only, same as the guards around it.
      - run: python tools/check_mock_model_declares_observation.py
      # The guard above asks whether a test tree reaches a job. This one asks
      # the same question one level up: whether a pull request reaches this
      # workflow at all. It used to filter `pull_request` to base `main`, so
      # #1806 and #1810 merged into a stack having run one check each while a
      # comparable PR against `main` ran twenty — the tests pinning a known
      # defect among the ones that never executed. Also fails if a job is added
      # without declaring its tier. Stdlib-only, same as the guards around it.
      - run: python tools/check_ci_pr_coverage.py
      # Three defects in 2026-08 were one defect written three times, and they
      # sort by the SHAPE of the call rather than by any physics: every site
      # that splats a resolved law dict is correct, every site that names its
      # kwargs by hand has drifted or will. #1833 bound `n_slope` at eight LUT
      # sites and dropped delta/bump/Rv; #1856 rebuilt it from
      # `params.get("dust_slope", -0.7)` for spectroscopy pixels; #1858's
      # `attenuate_emission` has no delta or Rv parameter to bind at all. A
      # hand-bound site passes what its author remembered, so a parameter added
      # later reaches every splatted site and no hand-rolled one. AST, not grep:
      # a call's keywords sit on different lines from its callee. Stdlib-only,
      # same as the guards around it.
      - run: python tools/check_dust_law_kwargs.py
      # Validates dust build-group dicts across the entire tree, including
      # docs/, reproduction/, bench/, scripts/ and other non-src locations.
      # Two dust changes (#1989, #2000) left 88 broken blocks outside src/ and
      # tests/ because no gate reaches dict VALUES in notebooks/markdown. Catches
      # retired dust= syntax, emission nested in dust_attenuation, and law
      # configuration errors in two_component/single_component blocks. File-level
      # allowlist for docs explaining the migration. Stdlib-only, no tengri import.
      - run: python tools/check_dust_group_grammar.py
      # #2234 regenerated the dust rows in docs/model_reference/parameters.md
      # from the registry while adding the nebular_screen/shock_screen/agn_screen
      # selectors, and found several pre-existing identifiers that had drifted
      # from the live registry with nothing to catch it (a #369-era rename left
      # behind, retired short spellings, a case mismatch). Reads ParamDeclaration/
      # ParamDef string literals via a plain AST parse. Stdlib-only, no tengri
      # import, same venv as the two guards above.
      - run: python tools/check_doc_param_names.py
      # `x / jnp.maximum(d, floor)` returns a plausible finite zero when the
      # numerator is also zero — #1395 shipped that way. The class cannot be
      # swept mechanically (some of these floors are legitimate), so this pins
      # the count instead: a new one has to be justified in the PR. Stdlib-only,
      # same as the guard above.
      - run: python tools/check_zero_hiding_clamps.py
      - run: python tools/check_representable_floors.py
      # Drift-proof ledger (#2050): keyed on (file, pattern), not line numbers,
      # so edits above a violation do not invalidate the ledger. Detects subnormal-
      # risk floors and clip-then-power patterns in src/tengri. Ledger regenerated
      # with each new site; new sites (live count > ledger count) fail the check.
      - run: python tools/check_numeric_guards.py
      # No dtype-free jnp.asarray on a module-level numpy constant (#2774): the
      # cached buffer's dtype follows the x64 state of the first call.
      - run: python tools/check_jnp_asarray_module_constants.py
      # Ensure figure placement in published notebooks is correct.
      - run: python tools/check_figure_placement.py
      # Verify that all published notebooks have every code cell executed.
      - run: python tools/check_notebooks_executed.py
      # Check that committed spine notebooks are not drifted from their sources.
      - run: python scripts/sync_spine_notebooks_for_docs.py --check
      # Validate that all reproduction notebooks have valid status assertions.
      - run: python tools/check_repro_status.py
      # A committed reproduction render must still match the source it claims
      # to have run from (metadata["tengri_render"]["source_sha256"]).
      # Non-strict: most comparisons predate the stamp, so an unstamped
      # render only warns; a stamped-but-stale one always fails.
      - run: python tools/check_repro_render_fresh.py
      # Verify version consistency between pyproject.toml and CITATION.cff.
      # The canonical version lives in pyproject.toml; CITATION.cff must match.
      # Turns a silent version mismatch into a red PR (#2103).
      - run: python tools/check_version_single_source.py
      # Census: verify every check_*.py is wired or explicitly declared not wired (#2050).
      - run: python tools/check_guard_wiring.py
      # The same hazard one directory over: a gallery example that catches
      # `Exception` per iteration and drops it. Per iteration that is correct;
      # when EVERY iteration fails the example carries on with nothing and
      # renders a figure that still looks populated — reference curves and
      # `fill_between([], [], label=...)` legend handles are drawn outside the
      # try — so `run_gallery_examples.py` scores it green. That is the #1145
      # hole the gallery job exists to close. Retention is the checkable half:
      # Python deletes the `as e` binding at the end of the block, so an author
      # who later adds the non-empty guard still has the cause to report.
      # No allowlist; all 24 broad handlers satisfy it. Stdlib-only.
      - run: python tools/check_example_silent_failure.py
      # `tools/` is where this repo keeps its own gates and probes, and almost
      # none of them are invoked by CI — so a rename under src/ breaks them
      # silently and there is no run to go red. Seven of 34 were dead on arrival
      # when this guard was added, all on one move
      # (`tengri.components.sps` -> `tengri.components.stellar.sps`). Among them
      # was audit_analysis_constants.py, which audits the JIT closure constants
      # behind the template-baking class that keeps coming back (#1383, #1462,
      # #1549, #1597) — the detector was itself unusable and nothing said so.
      # Resolves against the source tree rather than importing, so it stays
      # stdlib-only like the guards above and still reports on a tree whose
      # package does not import.
      - run: python tools/check_tools_imports.py
      # `nbsphinx_execute = "never"`, so the committed docs/spine/**/*.ipynb IS
      # the published page and nothing else checks it still matches the
      # notebooks/*.py it came from. Two ways of losing that have shipped: a
      # hand-copied render drifting from its source (docs/spine/experimental/ was
      # not in the sync script), and executing under MPLBACKEND=Agg, which makes
      # plt.show() a no-op so the page renders with no plots. Stdlib-only, same
      # as the guards above.
      - run: python tools/check_notebook_renders.py
      # Five notebooks stored 73 code cells as one run-on line with every
      # newline deleted ('import osimport sysimport time'), unreadable and
      # unrunnable, for months (#1820). The JSON stayed valid, so every
      # notebook-aware tool loaded them happily; the guard above covers
      # docs/spine/ only and ruff never reaches notebooks/archive_2. Flags on
      # length, NOT on failing to parse: a collapsed cell whose first line ends
      # in a comment swallows the rest of the cell and parses fine — 34 of the
      # 73, and the dangerous half, since the ones that fail to parse at least
      # announce themselves. Threshold 120 chars sits between the longest
      # healthy single-line cell (90) and the shortest damaged one (148).
      # Stdlib-only.
      - run: python tools/check_notebook_cells.py
      # A committed render can print a dead fit and still pass every notebook
      # guard above: check_notebook_renders reads source/render agreement and
      # tracebacks, never printed diagnostics, which is how docs/spine/05 shipped
      # max R-hat 1.6e14 beside a printed DeadFitWarning as "verified" (#2095).
      # This one parses printed R-hat/divergence/NaN lines and the DeadFit
      # warning text, with a known-bad ledger whose entries cite open issues
      # (#2095, #2113) and expire loudly when their render heals. Stdlib-only.
      - run: python tools/check_render_diagnostics.py
      # A paired notebook declares in its own metadata that its .ipynb and .py
      # are one document. Nothing enforced that, and three drifted for months:
      # 01_quickstart.ipynb kept teaching `Fitter(...)` after #1341 migrated the
      # mirror to `ForwardModel`; 05_prior_predictive and a figure notebook still
      # declared `sfh_tsnorm_log_peak_sfr`, a parameter #369 renamed; and
      # 02_the_api imported `Model`/`ParamSpec`, which tengri no longer exports,
      # so it died at its first cell with no mirror at all.
      # check_notebook_renders.py cannot see these -- it pairs notebooks/*.py
      # against docs/spine/** through an explicit SPINE_SLUGS list, so anything
      # outside that list passes without being looked at. Stdlib-only.
      - run: python tools/check_notebook_pairing.py
      # Notebooks are executed by no PR-time job (#1256), so this guard catches
      # the #1255 class — jax.jit/vmap over the non-pytree rich prediction surface
      # — at lint time, before the notebook runs. The scheduled notebooks.yml
      # execution tier covers the runtime error classes (NaN, divergence, etc.).
      # Stdlib-only.
      - run: python tools/check_notebook_jit_surfaces.py
      # NOTE: `gen_property_table.py --check` cannot live here. This job installs
      # ruff and nothing else, and the generator imports tengri (hence jax) to read
      # the property registry. It runs in `smoke`, which does `pip install -e`.
      # Gallery freshness (#805): fails when an example's committed
      # docs/auto_examples render lags its source. Warn-only until 2026-08, in
      # which time the drift grew 16 -> 60 examples; a gate that cannot fail
      # does not hold a line. CI cannot regenerate a render (no SSP grids, no
      # ~20 GB of optional data — see docs/conf.py), so the fix belongs to
      # whoever edited the example: `python tools/regen_gallery.py <basename>`.
      # Use that, never a bare `make html`, which strips executed output from
      # every page it rewrites but does not execute (#1236).
      - run: python tools/check_gallery_fresh.py --strict

  # Static security scan + dependency vulnerability check.
  #
  # These two are NOT treated alike, and the asymmetry is deliberate.
  #
  # `bandit` scans code in this repository. Every finding is actionable here,
  # and the baseline is clean (0 high, 0 medium at -ll), so it now blocks. It
  # was advisory until the seven medium+ findings were fixed rather than
  # tolerated: a SHA1 cache key that now says `usedforsecurity=False`, three
  # `urlopen` calls that now reject non-http(s) schemes, two pickle loads whose
  # trust model is written down, and a read-only /tmp fallback.
  #
  # `pip-audit` scans third-party dependencies, and stays advisory. A CVE can
  # be disclosed overnight, in a package nobody here controls, with no fixed
  # version yet published — and blocking on that hands the merge queue to other
  # projects' disclosure schedules. It reports; a human decides.
  #
  # Its invocation was also simply broken: `pip-audit --disable-pip` exits
  # non-zero with "The --disable-pip flag can only be used with --requirement",
  # so the step never audited anything, and `continue-on-error` hid that for as
  # long as it has been there. A scan that cannot run looks exactly like a scan
  # that finds nothing.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install bandit pip-audit
      - name: Static security scan (bandit, medium+ severity)
        run: bandit -r src/ -ll
      - name: Install for dependency audit
        run: pip install -e .
      # `--skip-editable` because `pip install -e .` above marks astro-tengri
      # editable and pip-audit cannot resolve such a distribution; auditing the
      # dependencies is the point. Advisory by design — see the job comment.
      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit --skip-editable
        continue-on-error: true

  # Decide how much of the expensive work this run owes: whether the gallery
  # below has to run, and which `test` shards.
  #
  # The gallery is four shards of ~8-10 min each, and it used to run on every
  # pull request: its only `if:` was the `labeled` no-op guard, which is not a
  # path filter. A prose-only pull request therefore spent ~35 minutes of runner
  # time re-executing 264 examples that nothing in the diff could reach. The
  # inputs that CAN change what an example does are enumerated below (`gallery_re`);
  # a diff touching none of them cannot change the gallery's verdict.
  #
  # The filter applies to a pull request that owes scope `all`. A cheap-tier
  # pull request never runs the gallery, and `schedule`, `workflow_dispatch` and
  # every `push` to `main` always do. A push cannot be filtered by its own diff:
  # pushes are coalesced, so a run's previous commit is not the last commit a
  # run tested, and a gallery input changed in a skipped intermediate commit
  # would be missed. Running it costs ~25 runner-minutes against a suite of
  # hours, and a skipped gallery that was needed ships a broken example.
  #
  # The same job decides the `test` scope, in a second output, so the answer is
  # computed once from one API call and one place:
  #
  #   all    every shard: `push` to main, the nightly and manual runs, a pull
  #          request labeled `full-tests`, and a pull request whose diff touches
  #          the CI machinery (`force_re`) or is too long to list completely.
  #   docs   the diff is confined to docs/, notebooks/, reproduction/ or a
  #          top-level *.md. Nothing under src/, data/ or tests/ moved, so the
  #          numerical shards cannot change; but those trees are NOT test-free.
  #          The `contract` shard holds the render-hash, docs-sync,
  #          registry-string and reproduction-driver guards, `components` holds
  #          `tests/unit` and a parity test that reads reproduction/,
  #          `regression-a1` (precision/test_geovi_metric_float32.py) reads docs/dev
  #          and `regression-d` scans every *.md (CLAUDE.md included).
  #          `regression-a2` and `regression-a3` read none of these trees but keep
  #          the scope their predecessor had. Those six
  #          shards run; the other five read
  #          none of these trees and are withheld. One exception is known:
  #          `tests/regression/bug/test_bug_vacuum_wavelengths_everywhere.py`
  #          scans `reproduction/**/*.py`, and a bug shard is withheld by this
  #          scope, so a refractive-index formula added under reproduction/ is
  #          caught on `main`, not on the PR. Markdown under src/, data/ or
  #          tests/ is NOT docs (src/tengri/data/agn_fe2/PROVENANCE.md is read
  #          by tests/regression/agn/test_feii_template_units.py), which is why
  #          only a TOP-LEVEL *.md counts.
  #   cheap  `physics` and `regression-c` only: a pull request without the
  #          `full-tests` label whose diff touches no documentation tree.
  #   cheap-docs  the cheap shards plus the four `docs` shards: a pull request
  #          without the label whose diff touches code AND documentation.
  #   none   a draft pull request. No shard; `ready_for_review` starts the run.
  #
  # The label set is read from the event payload, so it is the CURRENT set on
  # every pull-request event, including `labeled` / `unlabeled`.
  #
  # THE SHARD TABLE LIVES HERE AND NOWHERE ELSE. This step holds the one
  # definition of each shard (name, paths, worker count, step budget, JAX cache
  # cap, and the scopes that owe it) and emits the matrix the `test` job runs
  # (`shards`), the shard names the scope requires (`expected`) and every shard
  # name (`all_shards`). A shard the scope withholds is simply absent from the
  # matrix and never takes a runner. `ci-ok` lists the jobs that ran and
  # compares them with `expected`, so a shard that was owed and never ran is
  # red; it also holds its own copy of which shards each scope owes
  # (`tools/ci_ok.py: SCOPE_SHARDS`), pinned to this table by
  # `tests/contract/test_ci_gate_script.py`.
  #
  # NOTE FOR BRANCH PROTECTION: the `test (<shard>)` contexts exist only on runs
  # whose scope owes that shard. Require `ci-ok`, `lint`, `security` and `smoke`
  # and not the `test (...)` names.
  #
  # This job costs seconds: it asks the API for the changed paths and never
  # checks the repository out. Resolving the diff locally would need
  # `fetch-depth: 0`, and a full-history clone of this repository is a large
  # part of the saving it is trying to book.
  #
  # It fails TOWARD running. Any error listing the diff runs the gallery and
  # every shard, and so does a list that may be truncated: the pull-request
  # files API returns at most 3000 entries and the compare API at most 300 per
  # page, so a list at or above that length is taken to be incomplete. The two
  # mistakes are not symmetric: a gallery that runs when it did not need to
  # wastes runner minutes, while a gallery that is skipped when it was needed
  # ships a broken example. That is not hypothetical -- the gallery exists
  # because five examples were "migrated" to `model.predict(p, wave=...)`, a
  # kwarg that does not exist, and shipped green past py_compile, ruff, and a
  # docs build that never executed them (#1146). A skip must never be able to
  # hide that.
  #
  # Every classification below is a `grep` on a here-string, never a pipe into
  # `grep -q`: with `set -o pipefail`, `grep -q` exits at its first match, the
  # writer takes SIGPIPE on a list longer than the pipe buffer (~64 KB), and the
  # pipeline reports failure for a file list that DOES match. Measured: a code
  # file first in a 3000-entry docs list went undetected 20 times in 20.
  gallery-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `gallery` and `test` need this job's outputs, so gating here cascades.
    if: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      needed: ${{ steps.decide.outputs.needed }}
      scope: ${{ steps.decide.outputs.scope }}
      shards: ${{ steps.decide.outputs.shards }}
      expected: ${{ steps.decide.outputs.expected }}
      all_shards: ${{ steps.decide.outputs.all_shards }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE_REF: ${{ github.base_ref }}
          BASE_CHANGED: ${{ github.event.changes.base != null }}
          LABELS_JSON: ${{ github.event_name == 'pull_request' && toJSON(github.event.pull_request.labels.*.name) || '[]' }}
        run: |
          set -uo pipefail

          # The shard table: the single definition. Per shard: `paths` for
          # pytest, `bug_half` (non-empty for the three bug/ shards, split at
          # runtime), `nproc` (xdist workers), `timeout` (step budget, minutes),
          # `cache_gb` (JAX compile cache cap) and `scopes` (the scopes that
          # owe it). `scopes` is stripped before the matrix is emitted.
          table=$(cat <<'JSON'
          [
            {"shard":"contract","paths":"tests/contract","bug_half":"","nproc":2,"timeout":180,"cache_gb":"1.55","scopes":["docs","cheap-docs","all"]},
            {"shard":"components","paths":"tests/components tests/unit","bug_half":"","nproc":2,"timeout":50,"cache_gb":"0.6","scopes":["docs","cheap-docs","all"]},
            {"shard":"regression-a1","paths":"tests/regression/synthesizer_parity tests/regression/precision/test_agn_disc_float32.py tests/regression/precision/test_agn_disc_float32_inventory.py tests/regression/precision/test_agn_lbol_shape_dependence.py tests/regression/precision/test_bolometric_scale.py tests/regression/precision/test_bug_1859_flux_scale_log_domain.py tests/regression/precision/test_bug_2178_spectrum_precomp_mass_scale.py tests/regression/precision/test_dust_ir_float32.py tests/regression/precision/test_energy_balance_fail_open.py tests/regression/precision/test_energy_balance_galaxies.py tests/regression/precision/test_energy_balance_log_domain.py tests/regression/precision/test_fisher_float32.py tests/regression/precision/test_float32_boundary_inventory.py tests/regression/precision/test_float32_derived_properties.py tests/regression/precision/test_float32_end_to_end_spectroscopic.py tests/regression/precision/test_float32_grad_bolometric_seams.py tests/regression/precision/test_float32_grad_sed_path.py tests/regression/precision/test_float32_gradient_accuracy.py tests/regression/precision/test_float32_parity.py tests/regression/precision/test_float32_photometry_grad_seams.py tests/regression/precision/test_float32_scale_seam_sweep.py tests/regression/precision/test_forward_dtype_knob.py tests/regression/precision/test_geovi_metric_float32.py tests/regression/precision/test_graybody_grad_float32.py tests/regression/precision/test_inference_grad_float32.py tests/regression/precision/test_interp_dtype_float32.py tests/regression/precision/test_ionizing_log_domain.py tests/regression/precision/test_ionizing_scale.py tests/regression/precision/test_likelihood_float32.py tests/regression/precision/test_line_fluxes_float32_parity.py tests/regression/precision/test_log_companion_is_upstream.py tests/regression/precision/test_log_domain_corrupt_contract.py tests/regression/precision/test_log_line_properties.py tests/regression/precision/test_log_q_h_property.py tests/regression/precision/test_matmul_precision_default.py","bug_half":"","nproc":1,"timeout":70,"cache_gb":"0.5","scopes":["docs","cheap-docs","all"]},
            {"shard":"regression-a2","paths":"tests/regression/precision --ignore=tests/regression/precision/test_agn_disc_float32.py --ignore=tests/regression/precision/test_agn_disc_float32_inventory.py --ignore=tests/regression/precision/test_agn_lbol_shape_dependence.py --ignore=tests/regression/precision/test_bolometric_scale.py --ignore=tests/regression/precision/test_bug_1859_flux_scale_log_domain.py --ignore=tests/regression/precision/test_bug_2178_spectrum_precomp_mass_scale.py --ignore=tests/regression/precision/test_dust_ir_float32.py --ignore=tests/regression/precision/test_energy_balance_fail_open.py --ignore=tests/regression/precision/test_energy_balance_galaxies.py --ignore=tests/regression/precision/test_energy_balance_log_domain.py --ignore=tests/regression/precision/test_fisher_float32.py --ignore=tests/regression/precision/test_float32_boundary_inventory.py --ignore=tests/regression/precision/test_float32_derived_properties.py --ignore=tests/regression/precision/test_float32_end_to_end_spectroscopic.py --ignore=tests/regression/precision/test_float32_grad_bolometric_seams.py --ignore=tests/regression/precision/test_float32_grad_sed_path.py --ignore=tests/regression/precision/test_float32_gradient_accuracy.py --ignore=tests/regression/precision/test_float32_parity.py --ignore=tests/regression/precision/test_float32_photometry_grad_seams.py --ignore=tests/regression/precision/test_float32_scale_seam_sweep.py --ignore=tests/regression/precision/test_forward_dtype_knob.py --ignore=tests/regression/precision/test_geovi_metric_float32.py --ignore=tests/regression/precision/test_graybody_grad_float32.py --ignore=tests/regression/precision/test_inference_grad_float32.py --ignore=tests/regression/precision/test_interp_dtype_float32.py --ignore=tests/regression/precision/test_ionizing_log_domain.py --ignore=tests/regression/precision/test_ionizing_scale.py --ignore=tests/regression/precision/test_likelihood_float32.py --ignore=tests/regression/precision/test_line_fluxes_float32_parity.py --ignore=tests/regression/precision/test_log_companion_is_upstream.py --ignore=tests/regression/precision/test_log_domain_corrupt_contract.py --ignore=tests/regression/precision/test_log_line_properties.py --ignore=tests/regression/precision/test_log_q_h_property.py --ignore=tests/regression/precision/test_matmul_precision_default.py --ignore=tests/regression/precision/test_float32_fitting_path_seams.py","bug_half":"","nproc":1,"timeout":45,"cache_gb":"0.5","scopes":["docs","cheap-docs","all"]},
            {"shard":"regression-a3","paths":"tests/regression/precision/test_float32_fitting_path_seams.py","bug_half":"","nproc":1,"timeout":70,"cache_gb":"0.6","scopes":["docs","cheap-docs","all"]},
            {"shard":"regression-b1","paths":"","bug_half":"1","nproc":1,"timeout":120,"cache_gb":"0.7","scopes":["all"]},
            {"shard":"regression-b2","paths":"","bug_half":"2","nproc":1,"timeout":120,"cache_gb":"1.1","scopes":["all"]},
            {"shard":"regression-b3","paths":"","bug_half":"3","nproc":1,"timeout":120,"cache_gb":"1.1","scopes":["all"]},
            {"shard":"regression-c","paths":"tests/regression/paper tests/regression/agn","bug_half":"","nproc":1,"timeout":50,"cache_gb":"0.05","scopes":["cheap","cheap-docs","all"]},
            {"shard":"regression-d","paths":"tests/regression --ignore=tests/regression/synthesizer_parity --ignore=tests/regression/precision --ignore=tests/regression/bug --ignore=tests/regression/agn --ignore=tests/regression/paper","bug_half":"","nproc":1,"timeout":50,"cache_gb":"0.65","scopes":["docs","cheap-docs","all"]},
            {"shard":"physics","paths":"tests/physics","bug_half":"","nproc":2,"timeout":50,"cache_gb":"0.28","scopes":["cheap","cheap-docs","all"]}
          ]
          JSON
          )

          # emit <gallery needed: true|false> <test scope: all|docs|cheap|cheap-docs|none>
          emit() {
            local needed=$1 scope=$2 selector matrix
            case "$scope" in
              all)  selector='.' ;;
              none) selector='[]' ;;
              *)    selector="map(select(.scopes | index(\"$scope\")))" ;;
            esac
            if ! matrix=$(jq -c "{include: ($selector | map(del(.scopes)))}" <<<"$table"); then
              echo "::error::could not build the shard matrix for scope $scope"
              exit 1
            fi
            {
              echo "needed=$needed"
              echo "scope=$scope"
              echo "shards=$matrix"
              echo "expected=$(jq -c '[.include[].shard]' <<<"$matrix")"
              echo "all_shards=$(jq -c 'map(.shard)' <<<"$table")"
            } >> "$GITHUB_OUTPUT"
            echo "event=$EVENT -> gallery needed=$needed, test scope=$scope, shards=$(jq -c '[.include[].shard]' <<<"$matrix")"
          }

          # Print the changed filenames inside a stop-commands region under a
          # random token, so a filename such as `::warning::x` is printed as text
          # and cannot inject a workflow command.
          print_files() {
            local token
            token=$(openssl rand -hex 16 2>/dev/null) || token="$RANDOM$RANDOM$(date +%s%N)"
            echo "::stop-commands::$token"
            sed 's/^/  /' <<<"$files"
            echo "::$token::"
          }

          # The gallery's inputs. What an example's behaviour actually depends on:
          #   examples/                     the example sources themselves
          #   src/tengri/                   the library they exercise (the #1146 case)
          #   data/                         the grids they load at run time
          #   tools/run_gallery_examples.py the runner
          #   pyproject.toml                the dependency set
          #   .github/workflows/tests.yml   this job
          # docs/, notebooks/ and the spine generator are deliberately absent:
          # sphinx-gallery reads `examples/`, so no edit under docs/ can change
          # what an example does. `docs/auto_examples/` is generated OUTPUT.
          gallery_re='^(examples/|src/tengri/|data/|tools/run_gallery_examples\.py$|pyproject\.toml$|\.github/workflows/tests\.yml$)'

          # Documentation trees: top-level markdown and docs/, notebooks/ and
          # reproduction/. Markdown under src/, data/ or tests/ is data some test
          # reads, so it is not docs.
          docs_re='^(docs/|notebooks/|reproduction/)|^[^/]+\.md$'

          # A change to the CI machinery runs everything: the cheap tier is
          # computed by this very machinery, so a PR that edits it cannot be
          # trusted to have been routed by the old rules.
          # tools/ci_bug_durations.json is the ledger that splits regression/bug
          # across the three b-shards: a change to it moves tests between shards.
          force_re='^(\.github/workflows/|tools/ci_ok\.py$|tools/ci_split_paths\.py$|tools/ci_bug_durations\.json$|pyproject\.toml$|(.*/)?conftest\.py$)'

          # schedule and workflow_dispatch always run everything. The nightly is
          # the backstop that catches drift a per-PR filter cannot see.
          case "$EVENT" in
            schedule|workflow_dispatch) emit true all; exit 0 ;;
          esac

          # A draft is not proposed for merge. Lint, security and smoke still
          # run; the expensive tiers wait for ready_for_review.
          if [ "$EVENT" = "pull_request" ] && [ "$DRAFT" = "true" ]; then
            emit false none
            exit 0
          fi

          truncated=false
          case "$EVENT" in
            pull_request)
              # filename plus previous_filename: a rename src -> docs touches
              # src, and the old path must be classified too.
              if ! rows=$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
                    --jq '.[] | [.filename, (.previous_filename // "")] | @tsv'); then
                echo "could not list changed files -> running everything"
                emit true all
                exit 0
              fi
              if [ -z "$rows" ]; then
                echo "empty file list -> running everything"
                emit true all
                exit 0
              fi
              # The files API returns at most 3000 entries; a list that long may
              # be cut short, and a cut list can hide a code file behind docs.
              entries=$(grep -c '' <<<"$rows")
              if [ "$entries" -ge 3000 ]; then
                echo "$entries entries (the API stops at 3000): list may be truncated"
                truncated=true
              fi
              files=$(tr '\t' '\n' <<<"$rows" | sed '/^$/d')
              ;;
            push)
              # Every push to main runs the full suite and the gallery: pushes
              # are coalesced, so the diff of this push alone does not cover the
              # commits an earlier, superseded run would have tested.
              echo "push to main -> full suite and gallery"
              emit true all
              exit 0
              ;;
            *)
              echo "unrecognized event -> running everything"
              emit true all
              exit 0
              ;;
          esac

          echo "changed files:"
          print_files

          if [ "$ACTION" = "edited" ]; then
            if [ "$BASE_CHANGED" = "true" ]; then
              echo "edited: the base was retargeted to $BASE_REF"
            else
              echo "edited: the base did not change; the scope is recomputed from the same diff and labels"
            fi
          fi

          # -v inverts the match: `non_docs` is "at least one file is NOT
          # documentation", `any_docs` is "at least one is".
          non_docs=false; any_docs=false; force=false; gallery=false
          if grep -vqE "$docs_re" <<<"$files"; then non_docs=true; fi
          if grep -qE "$docs_re" <<<"$files"; then any_docs=true; fi
          if grep -qE "$force_re" <<<"$files"; then force=true; fi
          if grep -qE "$gallery_re" <<<"$files"; then gallery=true; fi

          # Does the pull request carry `full-tests`? Read from the event
          # payload, so it is the current label set on a labeled/unlabeled event.
          # The labels arrive as a JSON array and are never joined on a comma.
          full_label=false
          if jq -e 'index("full-tests") != null' <<<"$LABELS_JSON" > /dev/null; then
            full_label=true
          fi

          if [ "$full_label" = "true" ] || [ "$force" = "true" ] || [ "$truncated" = "true" ]; then
            scope=all
          elif [ "$non_docs" != "true" ]; then
            scope=docs
          elif [ "$any_docs" = "true" ]; then
            scope=cheap-docs
          else
            scope=cheap
          fi

          if [ "$scope" != "all" ]; then
            echo "-> pull request without full-tests: cheap tier ($scope), no gallery"
            gallery=false
          elif [ "$truncated" = "true" ]; then
            gallery=true
          elif [ "$gallery" = "true" ]; then
            echo "-> full suite, gallery inputs touched, running it"
          else
            echo "-> full suite, no gallery input touched, skipping it"
          fi
          emit "$gallery" "$scope"

  # Execute every sphinx-gallery example (#1146).
  #
  # Nothing else does. `docs/conf.py` builds its skip-list FROM DISK — sphinx-
  # gallery skips any example that already has a committed figure, and every
  # example has one — and `docs.yml` only runs on push:[main], never on a PR.
  # So the gallery was un-executed by CI entirely: during #1145 five examples
  # were "migrated" to `model.predict(p, wave=...)`, a kwarg that does not
  # exist. They raise TypeError. py_compile passed, ruff passed, the docs build
  # never ran them, and they would have shipped next to stale figures.
  #
  # Each example runs in-process, so a shard pays the JAX import once (~20 s) and
  # then ~1.8 s per example locally — but a CI runner is ~2x slower, and the full
  # 264 overran a 25-minute single job at example 133. Four shards, interleaved
  # (see --shard: the slow Cue/nebular examples sort together, so a contiguous
  # split would hand one shard every expensive one and time out while the others
  # idle).
  gallery:
    needs: gallery-changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `gallery-changes` carries the `labeled` guard too: when it skips, this job
    # sees an empty output and skips with it, so a label add stays a no-op.
    if: ${{ needs.gallery-changes.outputs.needed == 'true' }}
    # Bound this job's JAX cache entries so the repo's cached set fits the GitHub 10 GB quota.
    # Sizes from warm working sets; see CHANGELOG.md.
    env:
      TENGRI_JAX_CACHE_MAX_GB: "0.12"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Every grid the examples need is committed (#1146), so there is no download
      # step and a fresh clone behaves exactly like CI.
      - uses: actions/cache/restore@v6
        id: gallery_jax_cache
        with:
          path: ~/.cache/tengri_jax_cache
          key: jax-gallery-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles('src/tengri/**/*.py') }}
          restore-keys: jax-gallery-${{ runner.os }}-${{ matrix.shard }}-
      - name: Execute the gallery
        env:
          JAX_PLATFORMS: cpu
          MPLBACKEND: Agg
        run: python tools/run_gallery_examples.py --shard ${{ matrix.shard }}/4
      - uses: actions/cache/save@v6
        # `actions/cache` skips its implicit post-save when a job fails, so a cache
        # can never warm on a job that is ever red (the trap from #1055). Save
        # explicitly, and always.
        # Only the nightly writes: a PR or a push that saved here
        # would add a 120 MB entry per source change to a quota already full.
        if: always() && steps.gallery_jax_cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          path: ~/.cache/tengri_jax_cache
          key: ${{ steps.gallery_jax_cache.outputs.cache-primary-key }}

  smoke:
    runs-on: ubuntu-latest
    # 5 -> 8: the all-tier `--collect-only` step added below imports every test
    # module in the repo (14303 tests, ~10 s warm locally). The job last passed at
    # 3m30s, so 5 minutes left little headroom, and a guard that trips the job's
    # own timeout under load reports as a failure of the thing it guards.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Validate that all grammar blocks in documentation are complete and consistent.
      - run: python tools/check_doc_grammar_keys.py
      - run: python tools/check_param_prefixes.py
      - run: python tools/check_param_defaults.py
      # Grid-backed AGN priors (agn_log_nh_silva, agn_a_cat3d, agn_fwd_cat3d,
      # agn_cos_inc via cat3d and the SKIRTOR-AGNfitter tori, agn_oa_skirtor/agn_tv_skirtor)
      # must declare exactly the vendored HDF5 grid's own axis extent (#2050
      # Task 1, M-A). Needs only h5py + numpy (installed above), not a JIT
      # trace, so it lives beside the other declaration guards rather than in
      # `lint` (which installs only ruff).
      - run: python tools/check_param_grid_extent.py
      # A component class's class-level Uniform(lo, hi, ..., default=d)
      # restates one domain _params.py PARAMS declaration by literal, and
      # nothing required the two copies to agree: CAT3DTorus/Silva04Torus
      # (Task 1) and SKIRTORTorus (Task 14) each drifted this way and were
      # found only by hand. Pure ast + stdlib (no h5py/numpy needed, unlike
      # the guard above), verified to run in a venv with nothing installed
      # before being wired here.
      - run: python tools/check_param_restatements.py
      # A different question, one step earlier (#2241): not "is a signature
      # default inside its declared prior's support" but "is a signature
      # default, or a .get(name, literal) fallback, a bare numeral at all for
      # a name a declaration already owns". Equality with the declaration
      # cannot catch a pair that has already drifted (dust_T/dust_beta_ir did,
      # unnoticed, before this guard existed, #2261), so this checks
      # structure, not value. Scoped to the dust emission tree; stdlib-only,
      # so it needs no venv beyond the interpreter, unlike its sibling above.
      - run: python tools/check_literal_param_defaults.py
      # The redshift-specific instance of the same rule: a numeric default on
      # params.get('redshift', …) is unreachable in live paths and silences the
      # one condition worth hearing about — #1432.
      - run: python tools/check_redshift_defaults.py
      # The same rule as check_param_defaults, one step later: that guard checks
      # a signature *default* is inside the declared support; this one checks a
      # *call-site prior* still overlaps it. #369 renamed sfh_*_log_peak_sfr to
      # log_total_mass — log10(SFR) became log10(M*) — and carried the ranges
      # across unconverted, so 150 sites declared priors like Uniform(-1.0, 2.5)
      # on a stellar mass: 0.1–316 Msun, a prior for a small open cluster. Every
      # affected fit converged and nothing raised, so the tests kept passing
      # while testing a regime no galaxy occupies (#1819). Overlap, not
      # containment: narrowing or widening a prior is ordinary, but a range
      # sharing no point with the declaration is always a units error. Pinned
      # Fixed() scalars are deliberately out of scope — Fixed(0.0) on a
      # log_total_mass is a unit-mass normalization, not a bug.
      - run: python tools/check_param_ranges.py
      # #887's guarantee — every parameter is either freeable by
      # `all_params: FREE` or refused on the record with a documented reason —
      # shipped in #1638 with a guard that promises "adding a new one fails the
      # build until someone writes down which it is". It was never given a
      # `- run:` line, so it could not fail any build: the guarantee was
      # unenforced from the day it landed. This turns it on with no ratchet.
      - run: python tools/check_param_free_priors.py
      - run: python tools/check_test_markers.py
      # A @pytest.mark.slow test outside tests/inference and tests/integration
      # only runs if the `slow` job's matrix reaches its tree. One such test
      # never had, for three weeks. See the guard's own docstring.
      - run: python tools/check_slow_marks_reachable.py
      - run: python tools/check_single_dispatch.py
      - run: python tools/check_registry_completeness.py
      # ROADMAP.md names physics that does not exist yet; it has twice
      # listed modules that had already shipped. Needs the registries, so
      # it lives here rather than in `lint` (which installs only ruff).
      - run: python tools/check_roadmap_honest.py
      # The docs build cannot execute code (nbsphinx_execute = "never", no
      # `.. exec::`), so the API guide's property table is a COMMITTED generator
      # plus a checked-in output. This gate is what keeps it from going stale.
      # It needs the package importable, which is why it is here and not in `lint`.
      - run: python tools/gen_property_table.py --check
      # Docstrings in src/ ARE the published API reference (docs/api/*.rst are
      # autodoc stubs), and nothing executes their examples — there is no
      # doctest runner. That is how `ForwardModel.predict_properties()` and
      # `Observation.predict_photometry()` shipped in the docs while raising
      # AttributeError (#1268). This gate resolves every documented reference
      # against the real package. Like the generator above, it needs tengri
      # importable, so it lives here rather than in `lint`.
      - run: python tools/check_doc_examples.py
      # A menu cell prints the registry through tengri.list_*() at render time, so a
      # declaration edit leaves the published output quoting retired text (#2396:
      # nb03 still printed the pre-#2158 agn_grahsp_a_bc declaration). Compares every
      # registry row and parameter name quoted in the executed notebook outputs with
      # tengri.list_all(). Needs tengri importable, so it lives here. Clean on main,
      # so it runs --strict.
      - run: python tools/check_rendered_registry_strings.py --strict
      # The guard above asks whether every symbol NAMED IN THE DOCS exists. This
      # one asks the converse — whether every symbol tengri EXPORTS is named in
      # the docs — because the two failure modes are independent and only the
      # first was covered. #1345 closed the class surface while 23 exported
      # functions, both grammar sentinels and both spectral-index catalogs had
      # no autodoc entry at all; `nitpicky` is off and Sphinx does not fail on an
      # ABSENT page, so neither `-W` nor the guard above could see it.
      - run: python tools/check_api_coverage.py
      # A constant below float32's smallest subnormal (1.4e-45) is exactly 0.0
      # there, and if it multiplies anything that expression is silently zero —
      # how every CB19 line came back zero in pure float32 (#1568). Cannot live
      # beside `check_representable_floors` in `lint`: that one is a stdlib-only
      # AST scan of guard-call arguments, and the offender here is a *computed*
      # conversion constant (4.78e-13 / L_sun) that appears in no source literal
      # and in no guard call. Finding it requires importing and evaluating.
      - run: python tools/check_float32_representable_constants.py
      # Enumerates the CLASS its sibling above cannot see: a constant that is
      # perfectly representable on its own but leaves float32's range once it
      # multiplies a parameter, anywhere inside that parameter's declared prior
      # (#1388, #1439, #2100, #2178). Lives in `smoke` and not `lint` for the
      # same reason as its sibling: it reads priors from the registry, so it
      # needs tengri installed, and `lint` installs only ruff.
      - run: python tools/check_float32_scale_seams.py
      # Every benchmark fixture in bench/scripts/ must declare a provenance block
      # that proves it matches the notebook it claims to mirror (kind="mirrors"),
      # is a deliberate historical snapshot (kind="historical"), or is a control
      # (kind="standalone"). #2096 caught two silent drifts — nb05 rewrote law_bc
      # to law and nb00 simplified the model — and both kept their notebook label.
      # This guard prevents the drift from going unnoticed again.
      - run: python tools/check_harness_parity.py
      # Docs-prose voice guard (#2326): the enforcement NAMING_CONTRACT names
      # for confusable codepoints in published docs, plus notation canon and
      # dev-detail leakage. Strict since #2413 cleared its standing findings,
      # so a PR that reintroduces the class fails here.
      - run: python tools/check_docs_voice.py --strict
      # Every test module in EVERY tier must still import. `check_test_paths_covered`
      # proves a tree is named by some job; it cannot see whether the files in it
      # collect. Those are independent failures, and the second one is invisible
      # in the tiers the gate deselects: `-m 'not crossval and not slow'` never
      # imports them, so a crossval class that died of an ImportError sat green
      # for months and took the [N II] doublet check down with it (#1728/#1752).
      # `-m ''` clears the deselection, so this walks crossval, slow and benchmark
      # too. Collect-only, so it costs ~10 s and runs no test body. It also pins
      # `--strict-markers`: an unregistered mark is a collection error here rather
      # than a warning nobody reads — `-m unit` matched 0 tests while 157 files
      # declared it.
      - run: pytest --collect-only -q -m "" tests/ > /dev/null
      - run: pytest tests/components/sps/test_alpha_fe.py tests/components/stellar/test_stellar_skeleton.py -q --no-header
      # The `benchmark` tier: four tests that assert a wall-clock RATIO (fast path
      # vs exact path, cached vs cold). They are real regression guards — they catch
      # a precompute path silently degrading to the slow one — but they measure at
      # the ~30-60 us scale, where scheduler noise under `-n auto` swamps the signal:
      # a wall-clock ratio failed the default run at 324 us vs 32 us, then passed
      # 3/3 standalone. So they are deselected from the parallel gate in
      # pyproject and run HERE, serially (`-n 0`), where the ratio means something.
      # Serial is the whole point — do not "speed this up" with -n.
      #
      # It was five. `test_fast_path_not_slower` (dust precompute) left the tier
      # in 2026-08 because a wall-clock ratio could not do its job: with the age
      # grid closed over, XLA constant-folds the exact path down to the fast
      # path's own cost — both compile to 1717 FLOPs, so a silent fallback was
      # undetectable — while the 3x bound was loose enough to admit runner
      # jitter and tight enough to trip on it (43.4 vs 13.3 us on main,
      # 2026-08-11), skipping the whole `test` matrix downstream. It now
      # compares compiled FLOPs with the grid traced (2573 vs 1717), which is
      # deterministic and runs in the ordinary parallel sweep. Prefer that shape
      # for any new guard here: measure compiled cost, not wall clock, whenever
      # the question is "does this path do less work".
      - run: pytest tests/ -q --no-header -m 'benchmark and not slow and not crossval and not population_fit' -n 0

  test:
    # One job per shard the scope owes, named `test (<shard>)`. The matrix is
    # DYNAMIC: `gallery-changes` builds it (see its comment), so a withheld shard
    # never starts and never takes a runner. `ci-ok` checks that the shards that
    # ran are exactly the ones the scope requires.
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [smoke, gallery-changes]
    # `fromJSON` needs the gate's output, so this job can run only when the gate
    # succeeded; when it did not, `ci-ok` is red on the gate itself. `!cancelled()`
    # (not the implicit `success()`) so the condition is exactly what is written
    # here and a cancelled run is not reported as a skip. An empty matrix (a
    # draft, scope `none`) is not a valid matrix, so the job stands down; `ci-ok`
    # accepts that only for a scope that owes no shard. `github.base_ref` stays in
    # the condition because `tools/check_ci_pr_coverage.py` requires every
    # full-tier job to carry it.
    if: >-
      ${{ !cancelled()
      && needs.smoke.result == 'success'
      && needs.gallery-changes.result == 'success'
      && needs.gallery-changes.outputs.shards != ''
      && needs.gallery-changes.outputs.shards != '{"include":[]}'
      && (github.event_name != 'pull_request' || github.base_ref == 'main') }}
    # Bound this job's JAX cache entries so the repo's cached set fits the GitHub 10 GB quota.
    # Sizes from warm working sets (the shard table's `cache_gb`); see CHANGELOG.md.
    env:
      TENGRI_JAX_CACHE_MAX_GB: ${{ matrix.cache_gb }}
    # Sharded across runners, one tree per shard. The suite had grown to 22-24 min
    # against a 25 min cap — it was about to start failing on timeout rather than on
    # any test. More workers per runner is NOT the lever (that is exactly what OOM-
    # killed the VM; see the worker-count note below), but more RUNNERS is free:
    # matrix jobs run concurrently, so peak RSS per runner does not grow with the
    # number of shards.
    #
    # Worker count is now PER SHARD (`matrix.nproc`), not a uniform -n 2 — regression
    # runs serial. Any statement below of the form "each shard runs at -n 2" is only
    # true of contract/components/physics.
    #
    # Wall = slowest shard, not the sum, so splitting the small shards is free.
    # That principle is the only durable line in this block: every NUMBER below
    # carries a date, because each has already gone stale at least once.
    # See #1352 for the measurement history and why hand-maintained timing comments
    # are a second-source mistake.
    #
    # The regression shard (split four ways) holds the long pole, measured at
    # ~30 min on main @dd2da7acf (run 30864997361, 2026-08-04). Exact durations
    # drift; re-measure from CI before making major changes to any shard. Splitting
    # the long pole is free when measured against its budget (50 min in the matrix),
    # not the wall clock. See #1346 for the re-measure recipe.
    #
    # Why the exact numbers are not repeated here: Contract was once the long pole
    # at ~43% of the unified job (23 min). It has been overtaken twice, and hand-
    # maintained percentages kept drifting silently — most recently by two full
    # years, and then again three weeks after the correction was written. A bound
    # to a fixed number in CI config is fundamentally broken as a human-updated
    # second source. Derive the split from actual CI timings (GH API, Codecov
    # artifacts, or internal logs) instead of restating numbers here.
    #
    # regression and physics were ONE shard until 2026-07. They were split because
    # the paired shard walked back into the 16 GB ceiling: it died at ~21-22 min and
    # ~95-97% of the suite with 'The runner has received a shutdown signal' and zero
    # test failures — the same host-OOM signature the -n 2 note below describes, on a
    # shard that had since accumulated more compile-heavy NUTS/HMC regression files
    # (one measured at 2.6 GB peak alone). Two runners halve the per-worker
    # accumulation instead of paying for it in headroom. See #1346.
    strategy:
      fail-fast: false
      # The shard table is in `gallery-changes` (one definition: paths, worker
      # count, step budget, cache cap, owing scopes). Notes on why it says what
      # it says, kept here because the table is data:
      #
      #   * regression shards run SERIAL (`nproc: 1`). At -n 2 the shard was
      #     runner-killed at a consistent 92-93% offset on four refs: memory
      #     accumulates across the tests of a file (~0.66 GB/test unreleased in the
      #     worst one) and `--dist=loadfile` pins a file to one worker. More
      #     RUNNERS is free; more workers per runner is not (#1346).
      #   * `bug/` is split in thirds at runtime from the committed duration ledger
      #     (`tools/ci_bug_durations.json`, `tools/ci_split_paths.py`), so new test
      #     files are absorbed instead of landing on whichever side a frozen glob
      #     happens to match.
      #   * `components` also carries `tests/unit`, which was in no shard once and
      #     went dark; `tools/check_test_paths_covered.py` fails the build if any
      #     test tree escapes the table again.
      #   * budgets are above measured wall clock under runner-pool congestion
      #     (+60%): contract 180 (re-measured 2026-10-21: cut at 120 min at 86 % with no
      #     failure on two runs, so ~140 min complete; one worker holding a case marked
      #     `timeout(1800)` needs the room), regression-a1 70 (re-measured 2026-10-31:
      #     warm pytest max 39.1 min, job 119154441970; 50 left 28 % headroom),
      #     regression-a2 45, regression-a3 70 (a2/a3 unchanged until a cold-cache run
      #     is measured: every run 2026-10-21..30 restored its JAX cache),
      #     regression-b1/b2/b3 120 (re-measured 2026-10-21 once their #2748-era tests
      #     stopped failing in seconds: over two runs of the same tree the three shards
      #     took 48-72 min each, and each was cut at the old 70 at least once), the rest
      #     50. The per-test `--timeout=600` below
      #     still catches a real hang, so a budget bounds total wall clock only.
      #     Re-measure from a completed run's job durations before changing one.
      matrix: ${{ fromJSON(needs.gallery-changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Persist the XLA compile cache. Measured locally at -n 2: 468 s cold vs 307 s
      # warm -- a ~1.5x saving.
      #
      # `cache/restore` + `cache/save` with `if: always()`, NOT the combined
      # `actions/cache`: the combined action skips its implicit post-save when
      # the job fails or is cancelled, so a cache can never warm on a job that is
      # ever red (the same trap that made the slow tier's cache a no-op until
      # #1055).
      #
      # The key is CONTENT-HASHED, not per run: shard + hash(pyproject.toml) +
      # the installed JAX version, with a prefix `restore-keys` for the nearest
      # older snapshot. It used to end in `github.run_id`, which made every run's
      # key unique and every save a new entry: at one save per `main` push per
      # shard that wrote ~9 entries of ~0.5-1.5 GB per merge, evicting the
      # others, and left the repository at 10.25 GB of a 10 GB quota across 35
      # entries with the useful ones churned out before they were read. Now only
      # the nightly `schedule` run (and a manual dispatch on `main`) saves, and
      # only when no entry with the exact key exists, so one entry per shard is
      # resident and it changes when the dependency set, JAX or the ISO week does. JAX keys its
      # entries by program hash internally, so an older snapshot restored under
      # a changed source tree is a partial miss, never a wrong hit.
      - id: jaxver
        run: echo "v=$(python -c "from importlib.metadata import version; print(version('jax'))")" >> "$GITHUB_OUTPUT"
      # ISO year-week, so the key rotates weekly: with a key that depended only
      # on pyproject.toml and JAX, the nightly never found a reason to save
      # again and the snapshot went stale for as long as neither changed.
      - id: week
        run: echo "w=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: jax_cache
        with:
          path: ~/.cache/tengri_jax_cache
          key: tengri-jax-test-${{ matrix.shard }}-${{ hashFiles('pyproject.toml') }}-jax${{ steps.jaxver.outputs.v }}-${{ steps.week.outputs.w }}
          # The regression-a1/a2/a3 shards (split from regression-a, #2908/#2909) fall
          # back to the old shard's snapshot, which compiled the same tests, until
          # the nightly saves under their own keys. `regression-a-` cannot prefix-
          # match an `a1`/`a2`/`a3` key, and the empty line other shards get is
          # dropped by actions/cache. A fallback restore is not an exact hit, so the
          # nightly still saves each shard's own entry.
          restore-keys: |
            tengri-jax-test-${{ matrix.shard }}-${{ hashFiles('pyproject.toml') }}-
            tengri-jax-test-${{ matrix.shard }}-
            ${{ startsWith(matrix.shard, 'regression-a') && 'tengri-jax-test-regression-a-' || '' }}
      # Fast PR feedback: NO coverage instrumentation (cov adds ~30-50% wall
      # clock) — coverage runs separately on push/nightly in the `coverage` job
      # below. tests/inference + integration are gated to the slow tier; crossval
      # + the data-only nebular/draine parity files are ignored (they skip
      # without their grids).
      #
      # Worker count is `${{ matrix.nproc }}`, NOT `-n auto`. The runner is
      # 4 vCPU / 16 GB; `-n auto` spawns 4 workers, and when several
      # JAX-compile-heavy tests spike (XLA compile working set + SSP grids,
      # ~4–5 GB each) on different workers near the suite tail, peak RSS blew
      # past 16 GB and the host OOM-killed the VM — surfacing as
      # "##[error]The runner has received a shutdown signal" → "operation was
      # canceled" at 85–94 %, intermittently, with zero test failures (it hit
      # `main`, this job, and the `coverage` job below for ~2 days). The OOM kills
      # the VM before any per-test `--timeout` thread can fire, so fewer workers —
      # not a tighter timeout — is the fix. The wall clock this costs is recovered
      # above, by sharding (more runners) and the compile cache — NOT by raising
      # -n, which would just OOM again.
      #
      # This note used to end "`-n 2` caps peak at ~2×5 GB + base ≈ 12 GB, which
      # fits with headroom." That estimate is REFUTED for `regression`, which is
      # why the matrix now sets nproc per shard: the model assumed each worker's
      # peak is one test's peak, but memory accumulates ACROSS tests within a file
      # (~0.66 GB/test unreleased in the worst file, 1.87 GB for one test vs
      # 5.16 GB for six), and `--dist=loadfile` pins that whole file to one
      # worker. The per-worker figure is therefore a per-FILE total, not a
      # per-test one. Do not re-derive headroom from single-test peaks. See #1346.
      #
      # `--timeout=600 --timeout-method=signal` still guards the OTHER tail
      # failure mode: a single test that genuinely hangs (cold compile / deadlock)
      # stalls its worker while the others finish; the per-test cap converts that
      # into a fast, named failure (10 min ≫ any healthy test — all run < 150 s
      # locally) instead of a silent job-timeout.
      # `signal`, not `thread` (2026-10-06): under xdist, thread-method timeout
      # KILLS the worker process ("[gw1] node down: Not properly terminated",
      # #2759 job 111919847067), and with `--dist=loadfile` the file's remaining
      # tests are never rescheduled — the run froze at 98 % for 39 minutes with
      # no summary and no test name. signal fails the ONE test by name and the
      # run completes. A hang inside a single C/XLA call can outlast SIGALRM
      # until the call returns; the job cap stays the backstop for that.
      # Resolve the test paths. Normally that is just `matrix.paths`; for the
      # bug/ shards it is computed here so the split follows the directory
      # instead of a frozen list -- a hardcoded slice goes stale the moment someone
      # adds a test file, and the wrong slice silently grows.
      - name: Resolve test paths
        id: paths
        run: |
          set -euo pipefail
          if [ -z "${{ matrix.bug_half }}" ]; then
            echo "value=${{ matrix.paths }}" >> "$GITHUB_OUTPUT"
          else
            RESULT=$(python tools/ci_split_paths.py --root tests/regression/bug --part ${{ matrix.bug_half }} --of 3 --join --durations tools/ci_bug_durations.json 2>&1) || exit 1
            echo "value=$RESULT" >> "$GITHUB_OUTPUT"
          fi
      # `--durations` lists each shard's 60 slowest tests (>= 5 s) at the end of
      # its log, so a shard's growth can be named from a completed run (#2908).
      # `-v` (not `-q`) prints one line per test, and the Actions log stamps every
      # line, so a shard that hits its step budget (and never prints `--durations`)
      # can still be timed per test.
      - run: |
          pytest ${{ steps.paths.outputs.value }} -v \
            -n ${{ matrix.nproc }} \
            --timeout=600 --timeout-method=signal \
            --durations=60 --durations-min=5 \
            --ignore=tests/crossval \
            --ignore=tests/regression/paper/test_draine2021_pah_loader.py \
            --ignore=tests/regression/synthesizer_parity/test_nebular_continuum.py \
            --ignore=tests/regression/synthesizer_parity/test_nebular_fesc.py
        # Step budget: the shard table's `timeout` (see the notes on the matrix).
        # It bounds total wall clock; the per-test `--timeout=600` above is what
        # catches a real hang.
        timeout-minutes: ${{ matrix.timeout }}
      - uses: actions/cache/save@v6
        if: always() && steps.jax_cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          path: ~/.cache/tengri_jax_cache
          key: ${{ steps.jax_cache.outputs.cache-primary-key }}

  # The ONE context branch protection should require. Everything else advisory.
  #
  # Require exactly these four contexts, under the names GitHub shows: `ci-ok`,
  # `lint`, `security`, `smoke`. Do NOT require any `test (<shard>)` context: the
  # test matrix is built from the run's scope, so a shard the scope withholds has
  # no job and its context never reports. (Pin the four BEFORE merging the change
  # that made the matrix dynamic, or every pull request blocks on contexts that no
  # longer exist.) The shard list is therefore not duplicated into a repository
  # setting no file here can see; this job is what holds it.
  #
  # NOTHING CAN BE WITHHELD BY A SKIPPED JOB. A `skipped` result must never read
  # as approval, so `tools/ci_ok.py` holds that policy: the always-run gates must
  # be `success` (skipped is a policy violation there, not an outcome), the heavy
  # tiers may skip ONLY when the base is not `main` (or, for `test`, when a draft
  # owes no shard), and `gallery` may skip because `gallery-changes` decides it.
  #
  # The policy is a tested Python module rather than inline shell precisely
  # because this repo landed three new gates in one day that were themselves
  # broken (#1717, #1723, #1746). `tests/unit/test_ci_ok.py` asserts it goes RED
  # for each mistake it exists to catch; the skipped-heavy-job rule was verified
  # by inverting it and watching the suite fail, not by reading it.
  #
  # In `needs`: `coverage`, `slow`, `crossval` are included, but the tier policy
  # accepts their skip on runs that do not owe them (push, PR to non-main). On
  # schedule and workflow_dispatch, their failure or skip is red (issue #2128:
  # before this change, nightly schedule reds were invisible, because these jobs
  # were omitted from `needs`, so their results never reached the verdict policy
  # at all).
  #
  # Timing note: on schedule/dispatch runs, ci-ok publishes only after the
  # slowest gated job finishes (slow ~ up to 3 hours). This is deliberate and
  # free on PR/push runs where those jobs skip instantly.
  #
  # Which shards ran. `needs.test.result` is the worst of the shards that ran,
  # so it cannot show a shard that was owed and never started. This job lists
  # the run's `test (<shard>)` jobs through the API and `tools/ci_ok.py` compares
  # them with `expected` (the set the scope requires), and `expected` with its
  # own table of what each scope owes. A scope that was chosen wrongly, a shard
  # that is missing, a shard that ran and failed, and a shard that ran without
  # being owed are all red. A listing failure is red too, never an approval.
  #
  # Event policy: a push, the nightly and manual runs owe scope `all`; a pull
  # request owes `all` with the `full-tests` label and otherwise one of
  # `cheap` / `cheap-docs` / `docs`; a draft owes `none` (no shard, `test`
  # skipped). `ci-ok` reports on pull_request and push alike (`if: always()`, no
  # event filter).
  ci-ok:
    name: ci-ok
    # `always()` so this still runs — and still reports — when a dependency
    # fails or is skipped. Without it this job would itself be skipped by a red
    # dependency, publishing `skipped`, which does not satisfy a required
    # context and would block exactly the PRs it is meant to adjudicate.
    if: always()
    needs: [tier, lint, security, smoke, gallery-changes, gallery, test, slow, coverage, crossval]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      # The `test (<shard>)` jobs of THIS run, latest attempt. A failure to list
      # them leaves the file absent and `ci_ok.py` reports it; it is never read
      # as "no shard ran".
      - name: List the test shards that ran
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          if jobs=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" \
                --jq '.jobs[] | select(.name | startswith("test (")) | select(.conclusion != "skipped") | {name, conclusion}'); then
            jq -cs '.' <<<"$jobs" > "$RUNNER_TEMP/shard_jobs.json"
          else
            echo "::warning::could not list this run's jobs; ci-ok will report it"
          fi
      # stdlib only, so the runner's preinstalled python3 is enough — no
      # setup-python, no install. This job must stay seconds, not minutes: it
      # sits at the end of every run's critical path.
      - name: Apply the tier policy to this run's results
        run: python3 tools/ci_ok.py
        env:
          CI_OK_RESULTS: ${{ toJSON(needs) }}
          CI_OK_EVENT: ${{ github.event_name }}
          CI_OK_BASE_REF: ${{ github.base_ref }}
          CI_OK_SCOPE: ${{ needs.gallery-changes.outputs.scope }}
          CI_OK_EXPECTED_SHARDS: ${{ needs.gallery-changes.outputs.expected }}
          CI_OK_ALL_SHARDS: ${{ needs.gallery-changes.outputs.all_shards }}
          CI_OK_SHARD_JOBS_FILE: ${{ runner.temp }}/shard_jobs.json
          CI_OK_DRAFT: ${{ github.event.pull_request.draft }}
          CI_OK_ACTION: ${{ github.event.action }}
          CI_OK_EVENT_LABEL: ${{ github.event.label.name }}
          CI_OK_LABELS: ${{ github.event_name == 'pull_request' && toJSON(github.event.pull_request.labels.*.name) || '[]' }}

  # Alert on nightly schedule run failure. Opens or updates a deduplicated
  # issue when ci-ok fails on schedule events, so red nightly runs are never
  # silent (issue #2128).
  nightly-alarm:
    name: nightly-alarm
    if: always() && github.event_name == 'schedule'
    needs: [ci-ok]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update nightly failure issue
        if: needs.ci-ok.result != 'success'
        run: |
          set -euo pipefail
          ISSUES=$(gh issue list --state open --label nightly-red --limit 100 --json number,title --jq '[.[] | select(.title | startswith("[nightly-red]"))]')
          COUNT=$(printf '%s' "$ISSUES" | python3 -c 'import json, sys; print(len(json.load(sys.stdin)))')
          if [ "$COUNT" -eq 0 ]; then
            gh issue create \
              --title "[nightly-red] Tests schedule run failed" \
              --label nightly-red --label area:ci \
              --body "Schedule run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (commit ${{ github.sha }}) failed ci-ok check. See the run for details on which jobs failed."
          else
            ISSUE_NUM=$(printf '%s' "$ISSUES" | python3 -c 'import json, sys; issues = json.load(sys.stdin); print(issues[0]["number"] if issues else "")')
            gh issue comment "$ISSUE_NUM" \
              --body "Schedule run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (commit ${{ github.sha }}) also failed."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  # Full-suite coverage → Codecov, WITHOUT slowing PR feedback. Runs on
  # push-to-main, the nightly schedule, and manual dispatch — not on PRs.
  #
  # SHARDED, across the same three trees the `test` job uses (2026-07). This job ran
  # the entire fast tier in ONE process under coverage instrumentation, and it does
  # not fit in any sane cap:
  #
  #   test shards on main:  contract ~23 min + components ~9 + regression ~31 + physics ~3
  #                         (run 30147377624, 2026-07-25; regression grew with the
  #                         compile-heavy NUTS/HMC and grid-build files — #1352)
  #                         = ~66 min of work, and --cov adds a further 30-50%
  #
  # so it needs 70-80 min in a single job. It timed out at 35 (#1153), then at 50
  # (#1156, mine), and each bump only moved the wall — main stayed red both times.
  #
  # I argued against sharding this job on the grounds that its wall clock is off the
  # PR feedback path, so splitting buys no latency. That was the wrong frame: the cap
  # is not a latency question when the work does not FIT. And the reason I gave for
  # not splitting — "merging partial coverage reports is real machinery" — is simply
  # false: Codecov merges multiple uploads for the same commit natively. There is no
  # machinery. Three shards, three uploads, one merged report.
  #
  # Flags let Codecov attribute coverage per tree, which is a bonus, not a
  # requirement — the merge happens regardless.
  coverage:
    runs-on: ubuntu-latest
    needs: smoke
    # Runs only on `schedule` and `workflow_dispatch` (see `if:`), never on a
    # pull request or a push. This job and `test` take their shards from the same
    # table in `gallery-changes`, filtered by the run's scope, and run them over
    # the same paths at the same `-n`; the invocations differ only in `--cov`
    # (here) and `--timeout=600 --timeout-method=signal` (there).
    #
    # `test` is the dynamic matrix. A pull request runs the cheap tier (scopes
    # `cheap`, `cheap-docs` or `docs`) unless it carries `full-tests`; a draft
    # runs no shard; a push, a schedule and a dispatch run scope `all`. Keeping
    # `push` out of this job's trigger means a push to `main` runs each shard once
    # rather than twice, and takes the serial `coverage (regression-*)` shards,
    # the slowest things in the workflow, off `main`'s critical path.
    #
    # Nothing stops being tested. Every test still runs on every commit to
    # `main` — once, under `test`, which is also the half carrying the pytest
    # timeout. What moves is coverage REPORTING, from per-commit to the nightly
    # `schedule` (and `workflow_dispatch` on demand). Codecov merges uploads
    # natively, so the merged report is unaffected; only its cadence changes.
    #
    # Why this matters beyond runner minutes: at ~34 merges/day the push path
    # was outrunning the concurrent-job ceiling, so `Tests` on `main` took
    # 222-387 min wall-clock against ~21 min of compute. On 2026-08-12 a red
    # landed at 08:57, was fixed at 09:50, and CI first reported it at 10:13 --
    # 23 minutes AFTER the fix had merged, with five commits stacked on the red
    # in between. Halving the push path is the cheapest lever on that lag.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        # Per-shard worker count and step budget (same pattern as the `slow`
        # job's per-suite budgets). regression runs SERIAL: at -n 2 its
        # coverage job was runner-killed 3 of 3 attempts on main c36f53d80
        # ("runner has received a shutdown signal", ~29-31 min — #1346). Two
        # workers each carry the 2.51 GB import floor plus the grid-build
        # peaks (#1360: 3.5 GB), and --cov adds 30-50% on top; one worker
        # halves the resident footprint at ~2x wall — acceptable here because
        # this job is off the PR feedback path by construction. Interim
        # measure: #1362 (chunked fast-grid build) shrinks the underlying
        # allocation; revisit -n 2 once it lands.
        #
        # coverage_budget is 1.5 × budget rounded up to the next 5, because
        # --cov adds 30-50% memory and wall-clock overhead (measured 2026-08-13:
        # regression-a (before #2908's split) at 18m40s vs 40m00s with coverage on the same SHA).
        # The matrix literal is required: GitHub expressions have no arithmetic.
        include:
          # 70, not 50, for the same reason as the test job's contract row
          # above: pool congestion alone moved the same-SHA contract shard
          # ~25m -> 40m34s (2026-09-05), and this copy carries `--cov` on
          # top. The per-test `--timeout=600` still catches real hangs.
          - shard: contract
            paths: tests/contract
            nproc: 2
            budget: 70
            coverage_budget: 105
          # `tests/unit` rides along here (2026-07-26). It was in NO shard: the
          # #148 rehome emptied the tree and the matrix was rewritten around the
          # physics-first trees without it, so anything landing back in
          # `tests/unit` never gated a PR. Ten of its eleven files were the
          # #1322 API epic's, and one of them had been RED on main since #1337
          # phase 2 while CI stayed green. 87 tests, ~2 min at -n 2 — free
          # inside this shard's budget. `tools/check_test_paths_covered.py`
          # (lint job) now fails the build if any test tree escapes the matrix
          # again.
          - shard: components
            paths: tests/components tests/unit
            nproc: 2
            budget: 50
            coverage_budget: 75
          # regression is split FOUR ways, each SERIAL. Two independent knobs,
          # for two different problems:
          #
          #   nproc: 1  -> memory. With one worker a runner's peak is one file's
          #                peak, so no combination of heavy files can OOM it. At
          #                -n 2 this shard was runner-killed at a consistent
          #                92-93% offset on four separate refs (#1346).
          #   4 shards  -> wall clock. Serial cost the PR path 50 min (measured
          #                on #1372, against 30 min at -n 2 when it survived).
          #                More RUNNERS is free; more workers per runner is not.
          #
          # Boundaries are set from MEASURED shard durations. The first split used
          # wall clock attributed to subtrees by mapping progress-percentage
          # timestamps onto collection order, and that method UNDER-COUNTED bug/ by
          # 2.3x — it assumes tests are evenly weighted inside each progress
          # interval, and they are not. Predicted vs actual on #1380:
          #
          #   shard          predicted   ACTUAL
          #   regression-a      16.2      6m40s
          #   regression-b      11.4     26m24s   <- the long pole, 2.3x out
          #   regression-c      10.0      3m03s
          #   regression-d      10.5     15m18s
          #
          # So bug/ is now split in half at runtime (see the run step). Trust only
          # the ACTUAL column; re-measure from a completed run's job durations
          # rather than from progress lines. This file's timing notes have now gone
          # stale three times — treat every number here as needing a date.
          - shard: regression-a1
            paths: tests/regression/synthesizer_parity tests/regression/precision/test_agn_disc_float32.py tests/regression/precision/test_agn_disc_float32_inventory.py tests/regression/precision/test_agn_lbol_shape_dependence.py tests/regression/precision/test_bolometric_scale.py tests/regression/precision/test_bug_1859_flux_scale_log_domain.py tests/regression/precision/test_bug_2178_spectrum_precomp_mass_scale.py tests/regression/precision/test_dust_ir_float32.py tests/regression/precision/test_energy_balance_fail_open.py tests/regression/precision/test_energy_balance_galaxies.py tests/regression/precision/test_energy_balance_log_domain.py tests/regression/precision/test_fisher_float32.py tests/regression/precision/test_float32_boundary_inventory.py tests/regression/precision/test_float32_derived_properties.py tests/regression/precision/test_float32_end_to_end_spectroscopic.py tests/regression/precision/test_float32_grad_bolometric_seams.py tests/regression/precision/test_float32_grad_sed_path.py tests/regression/precision/test_float32_gradient_accuracy.py tests/regression/precision/test_float32_parity.py tests/regression/precision/test_float32_photometry_grad_seams.py tests/regression/precision/test_float32_scale_seam_sweep.py tests/regression/precision/test_forward_dtype_knob.py tests/regression/precision/test_geovi_metric_float32.py tests/regression/precision/test_graybody_grad_float32.py tests/regression/precision/test_inference_grad_float32.py tests/regression/precision/test_interp_dtype_float32.py tests/regression/precision/test_ionizing_log_domain.py tests/regression/precision/test_ionizing_scale.py tests/regression/precision/test_likelihood_float32.py tests/regression/precision/test_line_fluxes_float32_parity.py tests/regression/precision/test_log_companion_is_upstream.py tests/regression/precision/test_log_domain_corrupt_contract.py tests/regression/precision/test_log_line_properties.py tests/regression/precision/test_log_q_h_property.py tests/regression/precision/test_matmul_precision_default.py
            nproc: 1
            budget: 50
            coverage_budget: 105
          - shard: regression-a2
            paths: tests/regression/precision --ignore=tests/regression/precision/test_agn_disc_float32.py --ignore=tests/regression/precision/test_agn_disc_float32_inventory.py --ignore=tests/regression/precision/test_agn_lbol_shape_dependence.py --ignore=tests/regression/precision/test_bolometric_scale.py --ignore=tests/regression/precision/test_bug_1859_flux_scale_log_domain.py --ignore=tests/regression/precision/test_bug_2178_spectrum_precomp_mass_scale.py --ignore=tests/regression/precision/test_dust_ir_float32.py --ignore=tests/regression/precision/test_energy_balance_fail_open.py --ignore=tests/regression/precision/test_energy_balance_galaxies.py --ignore=tests/regression/precision/test_energy_balance_log_domain.py --ignore=tests/regression/precision/test_fisher_float32.py --ignore=tests/regression/precision/test_float32_boundary_inventory.py --ignore=tests/regression/precision/test_float32_derived_properties.py --ignore=tests/regression/precision/test_float32_end_to_end_spectroscopic.py --ignore=tests/regression/precision/test_float32_grad_bolometric_seams.py --ignore=tests/regression/precision/test_float32_grad_sed_path.py --ignore=tests/regression/precision/test_float32_gradient_accuracy.py --ignore=tests/regression/precision/test_float32_parity.py --ignore=tests/regression/precision/test_float32_photometry_grad_seams.py --ignore=tests/regression/precision/test_float32_scale_seam_sweep.py --ignore=tests/regression/precision/test_forward_dtype_knob.py --ignore=tests/regression/precision/test_geovi_metric_float32.py --ignore=tests/regression/precision/test_graybody_grad_float32.py --ignore=tests/regression/precision/test_inference_grad_float32.py --ignore=tests/regression/precision/test_interp_dtype_float32.py --ignore=tests/regression/precision/test_ionizing_log_domain.py --ignore=tests/regression/precision/test_ionizing_scale.py --ignore=tests/regression/precision/test_likelihood_float32.py --ignore=tests/regression/precision/test_line_fluxes_float32_parity.py --ignore=tests/regression/precision/test_log_companion_is_upstream.py --ignore=tests/regression/precision/test_log_domain_corrupt_contract.py --ignore=tests/regression/precision/test_log_line_properties.py --ignore=tests/regression/precision/test_log_q_h_property.py --ignore=tests/regression/precision/test_matmul_precision_default.py --ignore=tests/regression/precision/test_float32_fitting_path_seams.py
            nproc: 1
            budget: 45
            coverage_budget: 105
          - shard: regression-a3
            paths: tests/regression/precision/test_float32_fitting_path_seams.py
            nproc: 1
            budget: 70
            coverage_budget: 105
          # bug/ is ~20 min with no hotspot to extract (its heaviest single file is
          # 9.5% of the subtree), so it is split into thirds by FILE COUNT at runtime rather
          # than by a hardcoded list. `bug_half` triggers that in the run step;
          # new test files are absorbed automatically instead of silently landing
          # on whichever side a frozen glob happens to match.
          - shard: regression-b1
            paths: ""
            bug_half: "1"
            nproc: 1
            budget: 50
            coverage_budget: 75
          - shard: regression-b2
            paths: ""
            bug_half: "2"
            nproc: 1
            budget: 50
            coverage_budget: 75
          - shard: regression-b3
            paths: ""
            bug_half: "3"
            nproc: 1
            budget: 50
            coverage_budget: 75
          - shard: regression-c
            paths: tests/regression/paper tests/regression/agn
            nproc: 1
            budget: 50
            coverage_budget: 75
          # The top-level files only — every subdirectory above is excluded so no
          # test runs twice. This shard holds the memory-heaviest files
          # (test_field_latents_reach_likelihood.py at 4.06 GB).
          - shard: regression-d
            paths: >-
              tests/regression
              --ignore=tests/regression/synthesizer_parity
              --ignore=tests/regression/precision
              --ignore=tests/regression/bug
              --ignore=tests/regression/agn
              --ignore=tests/regression/paper
            nproc: 1
            budget: 50
            coverage_budget: 75
          - shard: physics
            paths: tests/physics
            nproc: 2
            budget: 50
            coverage_budget: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # `${{ matrix.nproc }}` (not `-n auto`): `--cov` adds ~30–50 % memory on top of
      # the test job, so this job OOM-killed the runner even more often than `test`
      # (the dominant cause of red `main`). Sharding does not change peak RSS per
      # runner — it only stops one runner from having to carry the whole tier.
      #
      # regression is `-n 1` here (#1371) and now also in `test` (#1372). The two
      # jobs are deliberately kept in the SAME shape: running the same tests at the
      # same commit on different runners is a free near-controlled experiment, and
      # when one passes while the other dies the test *content* is exonerated by
      # construction. That only holds while the jobs do not diverge in how they run.
      # Resolve the test paths. Normally that is just `matrix.paths`; for the
      # bug/ shards it is computed here so the split follows the directory
      # instead of a frozen list -- a hardcoded slice goes stale the moment someone
      # adds a test file, and the wrong slice silently grows.
      - name: Resolve test paths
        id: paths
        run: |
          set -euo pipefail
          if [ -z "${{ matrix.bug_half }}" ]; then
            echo "value=${{ matrix.paths }}" >> "$GITHUB_OUTPUT"
          else
            RESULT=$(python tools/ci_split_paths.py --root tests/regression/bug --part ${{ matrix.bug_half }} --of 3 --join --durations tools/ci_bug_durations.json 2>&1) || exit 1
            echo "value=$RESULT" >> "$GITHUB_OUTPUT"
          fi
      - run: |
          pytest ${{ steps.paths.outputs.value }} -q \
            -n ${{ matrix.nproc }} \
            --timeout=600 --timeout-method=signal \
            --cov=src/tengri --cov-report=xml --cov-report=term:skip-covered \
            --ignore=tests/crossval \
            --ignore=tests/regression/paper/test_draine2021_pah_loader.py \
            --ignore=tests/regression/synthesizer_parity/test_nebular_continuum.py \
            --ignore=tests/regression/synthesizer_parity/test_nebular_fesc.py
        # the three regression-a shards keep the 105 min coverage budget the
        # combined regression-a shard had.
        timeout-minutes: ${{ matrix.coverage_budget }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: ${{ matrix.shard }}
          fail_ci_if_error: false
        continue-on-error: true

  # Sampler-heavy inference tests (NUTS, Pathfinder, VI, MCLMC, etc.).
  # Run on:
  #   - nightly schedule
  #   - manual workflow_dispatch
  #   - PRs carrying the `run-slow-tests` label
  # Skip on a push to main and on a pull request without the label.
  #
  # The `if:` reads `github.event.pull_request.labels.*.name` -- the pull
  # request's CURRENT label set -- so it opts in on any pull-request event once
  # the label is on. `labeled` / `unlabeled` ARE triggers (the `full-tests` label
  # needs them), and so this job stands down on a label event that is not its own
  # label: an unrelated label never re-runs a multi-hour suite. Adding
  # `run-slow-tests` itself starts it.
  slow:
    runs-on: ubuntu-latest
    # Split the ~1,270-test tier across two parallel runners (one per suite):
    # run serially, the combined tier overran the 40-min step timeout (~55 %
    # done), so it never completed and its failure summary was never printed.
    # A single suite finishes well under the budget. Kept serial (no `-n`):
    # the sampler-heavy inference tests (NUTS/VI warmups) peak at several GB
    # each, so xdist workers would risk OOM on the 16 GB runner. `fail-fast:
    # false` so one suite's failure still lets the other report.
    strategy:
      fail-fast: false
      matrix:
        # Measured serial inference ≈ 51 min on a full run; the tier has died
        # before its summary line (#2363). Three contiguous file legs at 45 min
        # each print `--durations=30` so the legs are rebalanced from measured
        # durations, not static counts. integration still single-leg (114–118 min).
        include:
          - suite: inference
            part: 1
            of: 3
            timeout: 45
          - suite: inference
            part: 2
            of: 3
            timeout: 45
          - suite: inference
            part: 3
            of: 3
            timeout: 45
          - suite: integration
            timeout: 180
          # Every other @pytest.mark.slow test outside the two trees above.
          # tools/check_slow_marks_reachable.py fails the build if this list
          # stops being exhaustive. Unlike inference/integration (auto-marked
          # slow by path in tests/conftest.py's `_SLOW_TREES`), most tests in
          # these five trees are NOT slow and already run in the default
          # tier; `-m slow` below selects just the individually-decorated
          # ones. Timeout sized from a one-file-per-process measurement of
          # all 12 currently-slow files here (~546 s serial, all passing), plus
          # two nebular-grid contract files added 2026-10-02 (~1300 s serial,
          # measured under load on a Mac); 60 min keeps headroom for growth.
          # As of this change, test_agn_wildcard_measured_liveness.py (#2291)
          # is excluded and runs in its own entry below.
          - suite: components-unit-regression-contract-physics
            paths: tests/components tests/unit tests/regression tests/contract tests/physics
            ignore: --ignore=tests/contract/test_agn_wildcard_measured_liveness.py
            timeout: 60
          # The exhaustive AGN wildcard liveness sweep (#2291): 130 (category,
          # type) pairs plus the polar atten x torus sweep, each paying a full
          # composable SEDModel.build (~30 s on a runner) and no gradient on a
          # green tree. Its own entry so its budget is its own; the third entry
          # ignores the file (see `ignore` above).
          - suite: agn-wildcard-liveness
            paths: tests/contract/test_agn_wildcard_measured_liveness.py
            timeout: 90
    # Own concurrency group per suite: do NOT inherit the workflow-level
    # `cancel-in-progress: true` (which kills slow whenever main moves).
    # `cancel-in-progress: false` means newer slow triggers queue behind
    # an existing one — slow always runs to completion, never aborted by
    # an unrelated main push. See issue #160.
    concurrency:
      group: tests-slow-${{ matrix.suite }}-${{ matrix.part && format('{0}', matrix.part) || 'all' }}-${{ github.ref }}
      cancel-in-progress: false
    if: |
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'run-slow-tests')
          && (!contains(fromJSON('["labeled","unlabeled"]'), github.event.action)
              || github.event.label.name == 'run-slow-tests'))
    # Bound this job's JAX cache entries so the repo's cached set fits the GitHub 10 GB quota.
    # Sizes from warm working sets; see CHANGELOG.md.
    env:
      TENGRI_JAX_CACHE_MAX_GB: ${{ fromJSON('{"inference-1":"0.2","inference-2":"0.2","inference-3":"0.65","integration-all":"0.5","components-unit-regression-contract-physics-all":"0.12","agn-wildcard-liveness-all":"0.15"}')[format('{0}-{1}', matrix.suite, matrix.part || 'all')] }}
    timeout-minutes: 185
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Persist the JAX/XLA compilation cache across slow-tier runs.
      # `import tengri` auto-enables the on-disk cache
      # (~/.cache/tengri_jax_cache), but ephemeral runners start cold, so
      # every run re-paid the full VI/geoVI compile bill (the majority of
      # tests/inference wall-clock). Entries are keyed internally by
      # jaxlib version + XLA program hash, so a stale restore after a JAX
      # upgrade is a harmless miss, never a wrong hit. The run-id key with
      # prefix restore-keys implements an append-only cache: each run
      # restores the newest snapshot and saves its own superset.
      #
      # restore + save(if: always()), NOT the combined `actions/cache`: the
      # combined action's implicit post-save is SKIPPED when the job fails,
      # and this tier is red (#1031). A cache meant to speed up a failing
      # suite can never warm if warming requires the suite to pass — the
      # same trap that made the `test` job's cache a no-op (see its comment).
      # Content-hashed key (pyproject.toml + installed JAX), saved by the nightly
      # only; see the `test` job's cache note for why a per-run key was dropped.
      - id: jaxver
        run: echo "v=$(python -c "from importlib.metadata import version; print(version('jax'))")" >> "$GITHUB_OUTPUT"
      # ISO year-week: the key rotates weekly so the nightly re-saves; a key that
      # depended only on pyproject.toml and JAX left the snapshot stale.
      - id: week
        run: echo "w=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: jax_cache
        with:
          path: ~/.cache/tengri_jax_cache
          key: tengri-jax-${{ matrix.suite }}-${{ matrix.part && format('{0}', matrix.part) || 'all' }}-${{ hashFiles('pyproject.toml') }}-jax${{ steps.jaxver.outputs.v }}-${{ steps.week.outputs.w }}
          restore-keys: |
            tengri-jax-${{ matrix.suite }}-${{ matrix.part && format('{0}', matrix.part) || 'all' }}-${{ hashFiles('pyproject.toml') }}-
            tengri-jax-${{ matrix.suite }}-${{ matrix.part && format('{0}', matrix.part) || 'all' }}-
      # `-m 'not crossval'` overrides the default addopts selector, which
      # deselects the `slow` marker that conftest auto-applies to exactly these
      # two trees — without it this job would collect everything and run nothing.
      # `-n 0` keeps the tier serial: the default addopts now request `-n auto`,
      # but the sampler-heavy tests peak at several GB each and xdist workers
      # would OOM the 16 GB runner (the reason this tier was never parallelized).
      #
      # `matrix.of` partitions the inference tree into N file-legs, each with its
      # own pytest invocation and `--durations=30` report, enabling rebalancing
      # from measured durations rather than static counts.
      #
      # The `matrix.paths` entry covers @pytest.mark.slow tests living outside
      # tests/inference and tests/integration: those five trees are not auto-marked
      # slow by path, so `-m slow` (not `-m 'not crossval'`) selects only the
      # individually-decorated tests.
      #
      # Run under python -X faulthandler so seg faults print stack traces instead
      # of silent kills at interpreter teardown (the 139 exit code from slow leg 2).
      - run: |
          if [ -n "${{ matrix.of }}" ]; then
            python -X faulthandler -m pytest $(python tools/ci_split_paths.py --root tests/inference --part ${{ matrix.part }} --of ${{ matrix.of }} --join) -q --ignore=tests/crossval -m 'not crossval and not population_fit' -n 0 --durations=30
          elif [ -n "${{ matrix.paths }}" ]; then
            python -X faulthandler -m pytest ${{ matrix.paths }} -q -m 'slow and not population_fit' -n 0 ${{ matrix.ignore }}
          else
            python -X faulthandler -m pytest tests/${{ matrix.suite }} -q --ignore=tests/crossval -m 'not crossval and not population_fit' -n 0 --durations=30
          fi
        timeout-minutes: ${{ matrix.timeout }}
      # Marker-scoped, not tree-scoped: `slow` outside tests/inference and
      # tests/integration ran in NO job. The default addopts deselect the
      # marker, and the step above collects two trees by path, so a `slow`
      # test anywhere else was green nowhere -- which is where Task 16 put 130
      # measured AGN-liveness cases (the exhaustive owned-and-live and R22
      # polar sweeps), including every (category, type) pair the PR-tier
      # subset drops. Runs once, on the `inference` leg only, since the marker
      # expression is the same whichever suite the matrix is on.
      # `!cancelled()`, not `always()`: `always()` runs this step even when the
      # job was cancelled, so a cancelled run still spends 30 minutes here and
      # reports its own outcome. `!cancelled()` keeps the run-on-failure
      # behavior that matters (the step above going red must not skip this
      # tier) while letting a cancellation actually cancel.
      # The slow contract sweep rides on the inference suite; since this PR
      # splits inference into three matrix legs (part: 1/2/3), run it on leg 1
      # only to avoid redundant execution. The condition keeps working if the
      # split is ever removed.
      - if: ${{ !cancelled() && matrix.suite == 'inference' && (matrix.part == null || matrix.part == 1) }}
        run: python -X faulthandler -m pytest tests/contract -q -m 'slow and not crossval and not population_fit' -n 0 --durations=30
        timeout-minutes: 30
      - uses: actions/cache/save@v6
        if: always() && steps.jax_cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          path: ~/.cache/tengri_jax_cache
          key: ${{ steps.jax_cache.outputs.cache-primary-key }}

  # Cross-validation against FSPS / CIGALE / bagpipes / AGNfitter / Synthesizer.
  #
  # This tree was in NO job at all — every suite above passes
  # `--ignore=tests/crossval` or `-m 'not crossval'` — and it rotted accordingly:
  # measured on 2026-08-13 at 217 failures and 19 errors out of ~1,210, almost
  # all of it tests that had stopped importing their own subjects after
  # renames. Nothing was ever red, because nothing ever ran (#1728).
  #
  # It cost ~80-140 s serially to find all of that. The expense was never the
  # reason it went ungated; it simply was not wired up.
  #
  # NOT a PR gate yet, deliberately. ~45 failures remain — genuine numerical
  # comparisons that need physics judgment, plus reference data CI does not
  # carry — and a required check that is red on arrival teaches people to
  # ignore it, which is the failure mode this job exists to end. Nightly makes
  # the state *visible*, which was the missing ingredient. Promote to a PR gate
  # once the tier is green; #1728 tracks that.
  #
  # Serial (`-n 0`): xdist workers each hold a JAX process with SSP grids and
  # were observed dying on a 16 GB runner, and a crashed worker reports as an
  # infrastructure error rather than a test failure — which is precisely the
  # kind of ambiguity this tier is meant to remove.
  crossval:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'run-crossval')
          && (!contains(fromJSON('["labeled","unlabeled"]'), github.event.action)
              || github.event.label.name == 'run-crossval'))
    # 30 -> 45: the per-file loop pays pytest+JAX startup ~55 times, and the
    # first run on a cold compile cache also pays every compilation once.
    # Bound this job's JAX cache entries so the repo's cached set fits the GitHub 10 GB quota.
    # Sizes from warm working sets; see CHANGELOG.md.
    env:
      TENGRI_JAX_CACHE_MAX_GB: "0.05"
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Persist the JAX compile cache (same pattern as the `test` job).
      - id: jaxver
        run: echo "v=$(python -c "from importlib.metadata import version; print(version('jax'))")" >> "$GITHUB_OUTPUT"
      # ISO year-week, as in the `test` and `slow` jobs: the key rotates weekly so
      # the nightly re-saves the snapshot.
      - id: week
        run: echo "w=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: jax_cache
        with:
          path: ~/.cache/tengri_jax_cache
          key: tengri-jax-crossval-${{ hashFiles('pyproject.toml') }}-jax${{ steps.jaxver.outputs.v }}-${{ steps.week.outputs.w }}
          restore-keys: |
            tengri-jax-crossval-${{ hashFiles('pyproject.toml') }}-
            tengri-jax-crossval-
      # Reference grids are not in the repo; the affected modules skip
      # themselves when absent, so a missing file is reported as a skip rather
      # than an error. Check the skip count, not just the exit status.
      #
      # One pytest process PER FILE, deliberately: compiled XLA kernels are
      # retained per process, and this tier builds so many distinct model
      # structures that a single process accumulates tens of GB (measured
      # 35.6 GB for a 27-file half, 38.5 GB for the whole tier) and dies on a
      # 7 GB runner — which is how the tier stayed unrunnable (#1728). The
      # per-file peak is <=2 GB, and the persistent JAX cache above carries
      # compilations across the processes, so the loop stays cheap once warm.
      - name: Run cross-validation tier (one process per file)
        run: |
          mkdir -p crossval-results
          status=0
          while IFS= read -r f; do
            b=$(basename "$f" .py)
            pytest "$f" -q --no-header -m 'crossval and not oom' -n 0 -rfE \
              --junit-xml="crossval-results/${b}.xml" || rc=$?
            rc=${rc:-0}
            # 0 = green, 5 = nothing selected in this file (all deselected):
            # both fine. Anything else marks the job failed but the loop
            # continues so every file still reports.
            if [ "$rc" != "0" ] && [ "$rc" != "5" ]; then
              echo "::error::$b exited $rc"
              status=1
            fi
            unset rc
          done < <(find tests/crossval -maxdepth 1 -name 'test_*.py' | sort)
          exit $status
        env:
          JAX_PLATFORMS: cpu
          TENGRI_JAX_CACHE_DIR: ~/.cache/tengri_jax_cache
      - name: Verify the per-file runs covered the whole tier
        if: always()
        env:
          JAX_PLATFORMS: cpu
        run: |
          # Anti-rot guard: the testcases the per-file runs actually recorded
          # must equal what a whole-tier collection selects. A missing xml (a
          # killed file) or a glob edit that drops files fails here — the loop
          # cannot silently shrink coverage. (Job failure on red tests comes
          # from the pytest exit codes in the loop; this guards coverage only.)
          expected=$(pytest tests/crossval --collect-only -q -m 'crossval and not oom' | grep -c '::')
          ran=0
          nfiles=$(ls -1 tests/crossval/test_*.py | wc -l)
          nxml=$(ls -1 crossval-results/*.xml 2>/dev/null | wc -l)
          if [ "$nfiles" != "$nxml" ]; then
            echo "ERROR: $nfiles test files but $nxml junit reports — a file's run never finished"
            exit 1
          fi
          for f in crossval-results/*.xml; do
            # Count real testcases (non-empty classname). A module whose
            # reference package is absent skips at COLLECTION and pytest
            # records one placeholder <testcase classname=""> for it, which
            # collect-only does not list — counting the testsuite's tests=
            # attribute overcounted by one per such module (7 on hosted
            # runners, first dispatch run 32293846721).
            n=$(grep -o '<testcase classname="[^"]' "$f" | wc -l)
            ran=$((ran + ${n:-0}))
          done
          echo "expected=$expected ran=$ran"
          if [ "$expected" != "$ran" ]; then
            echo "ERROR: the per-file runs recorded $ran testcases but the tier selects $expected"
            exit 1
          fi
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crossval-test-results
          path: crossval-results/
      - uses: actions/cache/save@v6
        if: always() && steps.jax_cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          path: ~/.cache/tengri_jax_cache
          key: ${{ steps.jax_cache.outputs.cache-primary-key }}
