name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Nightly slow-tier run at 04:00 UTC (mid-afternoon Tokyo).
    - cron: "0 4 * * *"
  workflow_dispatch:

# Supersede stale runs — but NEVER on `main`.
#
# **`push` runs get a UNIQUE group (run_id), so every commit on `main` is tested
# to completion.** They used to share one group and cancel each other, which
# meant that during any busy merge window `main` was effectively never tested:
# each merge aborted its predecessor's suite, and the last one standing was the
# only commit anyone ever saw a verdict for. On 2026-07-10 that let FIVE red
# commits land on `main` invisibly (#1021, #1051, #1071, #1076, and the
# cancelled run of the very PR that fixed the last two). Each was discovered
# days later or when it broke somebody else's unrelated PR — the most expensive
# possible way to find out.
#
# Note the failure mode this does NOT use: keeping one shared group and setting
# `cancel-in-progress: false` would serialise main's runs into a queue instead.
# At ~12 merges/day against a ~21 min suite, the backlog just relocates the
# delay — you would still learn about red long after the fact. A unique group
# per push means N merges run N suites concurrently, each reporting on its own
# commit. That costs runner minutes; a `main` whose green means nothing costs
# more.
#
# `labeled` PR events also get a unique group, so a label add never aborts the
# real opened/synchronize run. (Their jobs also skip via the per-job `if:`
# below, so the unique-group run is a near-instant no-op.)
#
# Everything else (PR opened/synchronize/reopened, schedule, workflow_dispatch)
# keys on `github.event_name`, so a newer event of the SAME kind supersedes the
# older one — a PR synchronize cancels the prior PR run, which is where the real
# compute saving lives, since PR runs get superseded constantly. Keying on the
# event name also keeps a nightly `schedule` run and a `push` run from sharing a
# group on `main` (both resolve to the same `github.ref`) and cancelling each
# other mid-suite.
concurrency:
  group: >-
    tests-${{ github.ref }}-${{
      (github.event_name == 'push'
        || (github.event_name == 'pull_request' && github.event.action == 'labeled'))
      && github.run_id || github.event_name }}
  cancel-in-progress: true

# Supply a version for the `dsps` build. The published dsps sdists use
# setuptools-scm, which (in the fresh pip build-isolation env) raises
# `LookupError: unable to detect version` when built without a .git checkout —
# turning the install step red for every dsps release. Pretending a version lets
# the sdist build; it is purely a build-time stamp and does not change the
# resolved dependency (pinned to <0.4.8 in pyproject.toml). See #798.
env:
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DSPS: "0.4.7"

# Skip the heavy jobs on bare `labeled` PR events. GitHub fires one `labeled`
# webhook PER label added, so labelling a PR with N labels used to spawn N
# duplicate workflow runs that immediately cancelled each other under
# `cancel-in-progress` (and occasionally killed the surviving run mid-suite).
# Only the `slow` job cares about labels (`run-slow-tests`); everything else
# should run on push / opened / synchronize / reopened, not on label adds.
jobs:
  lint:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'labeled' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install "ruff==0.15.6"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: python tools/add_spdx_headers.py --check
      - run: python tools/check_british_spelling.py
      # NOTE: `gen_property_table.py --check` cannot live here. This job installs
      # ruff and nothing else, and the generator imports tengri (hence jax) to read
      # the property registry. It runs in `smoke`, which does `pip install -e`.
      # Gallery freshness — warn-only (#805): reports examples whose committed
      # docs/auto_examples render has drifted from the source. Informational
      # until the heavy-fit examples (#612) are handled; promote to --strict then.
      - run: python tools/check_gallery_fresh.py

  # Static security scan + dependency vulnerability check. Informational
  # for now (continue-on-error) — surfaces findings in the PR check UI
  # without blocking. Promote to required once the baseline is clean.
  security:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'labeled' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install bandit pip-audit
      - name: Static security scan (bandit, high severity)
        run: bandit -r src/ -ll
        continue-on-error: true
      - name: Install for dependency audit
        run: pip install -e .
      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit --disable-pip
        continue-on-error: true

  # Decide whether the gallery below has to run for this change.
  #
  # The gallery is four shards of ~8-10 min each, and it used to run on every
  # pull request: its only `if:` was the `labeled` no-op guard, which is not a
  # path filter. A prose-only pull request therefore spent ~35 minutes of runner
  # time re-executing 264 examples that nothing in the diff could reach. The
  # inputs that CAN change what an example does are enumerated below; a diff
  # touching none of them cannot change the gallery's verdict.
  #
  # This job costs seconds: it asks the API for the changed paths and never
  # checks the repository out. Resolving the diff locally would need
  # `fetch-depth: 0`, and a full-history clone of this repository is a large
  # part of the saving it is trying to book.
  #
  # It fails TOWARD running. Any error listing the diff, and any event that is
  # not a pull request, runs the gallery. The two mistakes are not symmetric: a
  # gallery that runs when it did not need to wastes runner minutes, while a
  # gallery that is skipped when it was needed ships a broken example. That is
  # not hypothetical -- the gallery exists because five examples were "migrated"
  # to `model.predict(p, wave=...)`, a kwarg that does not exist, and shipped
  # green past py_compile, ruff, and a docs build that never executed them
  # (#1146). A skip must never be able to hide that.
  gallery-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'labeled' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      needed: ${{ steps.decide.outputs.needed }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          # push:[main], schedule and workflow_dispatch always run it. Those are
          # the runs whose green anyone actually relies on, and the nightly is
          # the backstop that catches drift a per-PR filter cannot see.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "event=${{ github.event_name }} -> running the gallery"
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! files=$(gh api --paginate \
                 "repos/$REPO/pulls/$PR/files" --jq '.[].filename'); then
            echo "could not list changed files -> running the gallery"
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$files" ]; then
            echo "empty file list -> running the gallery"
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed files:"
          echo "$files" | sed 's/^/  /'

          # What an example's behaviour actually depends on:
          #   examples/                     the example sources themselves
          #   src/tengri/                   the library they exercise (the #1146 case)
          #   data/                         the grids they load at run time
          #   tools/run_gallery_examples.py the runner
          #   pyproject.toml                the dependency set
          #   .github/workflows/tests.yml   this job
          # docs/, notebooks/ and the spine generator are deliberately absent:
          # sphinx-gallery reads `examples/`, so no edit under docs/ can change
          # what an example does. `docs/auto_examples/` is generated OUTPUT.
          if echo "$files" | grep -qE '^(examples/|src/tengri/|data/|tools/run_gallery_examples\.py$|pyproject\.toml$|\.github/workflows/tests\.yml$)'; then
            echo "-> gallery inputs touched, running it"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "-> no gallery input touched, skipping it"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

  # Execute every sphinx-gallery example (#1146).
  #
  # Nothing else does. `docs/conf.py` builds its skip-list FROM DISK — sphinx-
  # gallery skips any example that already has a committed figure, and every
  # example has one — and `docs.yml` only runs on push:[main], never on a PR.
  # So the gallery was un-executed by CI entirely: during #1145 five examples
  # were "migrated" to `model.predict(p, wave=...)`, a kwarg that does not
  # exist. They raise TypeError. py_compile passed, ruff passed, the docs build
  # never ran them, and they would have shipped next to stale figures.
  #
  # Each example runs in-process, so a shard pays the JAX import once (~20 s) and
  # then ~1.8 s per example locally — but a CI runner is ~2x slower, and the full
  # 264 overran a 25-minute single job at example 133. Four shards, interleaved
  # (see --shard: the slow Cue/nebular examples sort together, so a contiguous
  # split would hand one shard every expensive one and time out while the others
  # idle).
  gallery:
    needs: gallery-changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `gallery-changes` carries the `labeled` guard too: when it skips, this job
    # sees an empty output and skips with it, so a label add stays a no-op.
    if: ${{ needs.gallery-changes.outputs.needed == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Every grid the examples need is committed (#1146), so there is no download
      # step and a fresh clone behaves exactly like CI.
      - uses: actions/cache/restore@v4
        id: gallery_jax_cache
        with:
          path: ~/.cache/tengri_jax_cache
          key: jax-gallery-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles('src/tengri/**/*.py') }}
          restore-keys: jax-gallery-${{ runner.os }}-${{ matrix.shard }}-
      - name: Execute the gallery
        env:
          JAX_PLATFORMS: cpu
          MPLBACKEND: Agg
        run: python tools/run_gallery_examples.py --shard ${{ matrix.shard }}/4
      - uses: actions/cache/save@v4
        # `actions/cache` skips its implicit post-save when a job fails, so a cache
        # can never warm on a job that is ever red (the trap from #1055). Save
        # explicitly, and always.
        if: always() && steps.gallery_jax_cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/tengri_jax_cache
          key: ${{ steps.gallery_jax_cache.outputs.cache-primary-key }}

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'labeled' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python tools/check_param_prefixes.py
      - run: python tools/check_test_markers.py
      - run: python tools/check_single_dispatch.py
      - run: python tools/check_registry_completeness.py
      # The docs build cannot execute code (nbsphinx_execute = "never", no
      # `.. exec::`), so the API guide's property table is a COMMITTED generator
      # plus a checked-in output. This gate is what keeps it from going stale.
      # It needs the package importable, which is why it is here and not in `lint`.
      - run: python tools/gen_property_table.py --check
      # Docstrings in src/ ARE the published API reference (docs/api/*.rst are
      # autodoc stubs), and nothing executes their examples — there is no
      # doctest runner. That is how `ForwardModel.predict_properties()` and
      # `Observation.predict_photometry()` shipped in the docs while raising
      # AttributeError (#1268). This gate resolves every documented reference
      # against the real package. Like the generator above, it needs tengri
      # importable, so it lives here rather than in `lint`.
      - run: python tools/check_doc_examples.py
      - run: pytest tests/components/sps/test_alpha_fe.py tests/components/stellar/test_stellar_skeleton.py -q --no-header
      # The `benchmark` tier: five tests that assert a wall-clock RATIO (fast path
      # vs exact path, cached vs cold). They are real regression guards — they catch
      # a precompute path silently degrading to the slow one — but they measure at
      # the ~30-60 us scale, where scheduler noise under `-n auto` swamps the signal:
      # `test_fast_path_not_slower` failed the default run at 324 us vs 32 us, then
      # passed 3/3 standalone. So they are deselected from the parallel gate in
      # pyproject and run HERE, serially (`-n 0`), where the ratio means something.
      # Serial is the whole point — do not "speed this up" with -n.
      - run: pytest tests/ -q --no-header -m 'benchmark and not slow and not crossval' -n 0

  test:
    runs-on: ubuntu-latest
    needs: smoke
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'labeled' }}
    # Sharded across runners, one tree per shard. The suite had grown to 22-24 min
    # against a 25 min cap — it was about to start failing on timeout rather than on
    # any test. More workers per runner is NOT the lever (that is exactly what OOM-
    # killed the VM; see the -n 2 note below), but more RUNNERS is free: matrix jobs
    # run concurrently, each still capped at -n 2, so peak RSS per runner is unchanged.
    #
    # Shares of the old single-job wall clock, measured at -n 2:
    #   contract 43% · components 28% · regression 22% · physics 7%
    # so regression+physics pair into one shard and `contract` (the long pole) sets
    # the wall clock. Wall = slowest shard, not the sum.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: contract
            paths: tests/contract
          - shard: components
            paths: tests/components
          - shard: physics-regression
            paths: tests/physics tests/regression
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Persist the XLA compile cache. Measured locally at -n 2: 468 s cold vs 307 s
      # warm — a ~1.5x saving that this job has been paying on every run.
      #
      # It was dropped once with the note "it never warmed — cancelled runs don't save
      # it". That diagnosis was right and the conclusion was wrong: the combined
      # `actions/cache` skips its implicit post-save when the job is cancelled OR fails,
      # so a cache can never warm on a job that is ever red — the same trap that made
      # the slow tier's cache a no-op until #1055. `cache/restore` + `cache/save` with
      # `if: always()` writes regardless of outcome. Keyed per shard (each sees a
      # different slice of the compile graph) with a run-id key + prefix restore-keys,
      # so each run restores the newest snapshot and saves its own superset.
      - uses: actions/cache/restore@v4
        id: jax_cache
        with:
          path: ~/.cache/tengri_jax_cache
          key: tengri-jax-test-${{ matrix.shard }}-${{ hashFiles('pyproject.toml') }}-${{ github.run_id }}
          restore-keys: |
            tengri-jax-test-${{ matrix.shard }}-${{ hashFiles('pyproject.toml') }}-
      # Fast PR feedback: NO coverage instrumentation (cov adds ~30-50% wall
      # clock) — coverage runs separately on push/nightly in the `coverage` job
      # below. tests/inference + integration are gated to the slow tier; crossval
      # + the data-only nebular/draine parity files are ignored (they skip
      # without their grids).
      #
      # pytest-xdist parallelism is capped at `-n 2`, NOT `-n auto`. The runner
      # is 4 vCPU / 16 GB; `-n auto` spawns 4 workers, and when several
      # JAX-compile-heavy tests spike (XLA compile working set + SSP grids,
      # ~4–5 GB each) on different workers near the suite tail, peak RSS blew
      # past 16 GB and the host OOM-killed the VM — surfacing as
      # "##[error]The runner has received a shutdown signal" → "operation was
      # canceled" at 85–94 %, intermittently, with zero test failures (it hit
      # `main`, this job, and the `coverage` job below for ~2 days). `-n 2` caps
      # peak at ~2×5 GB + base ≈ 12 GB, which fits with headroom. The OOM kills the
      # VM before any per-test `--timeout` thread can fire, so fewer workers — not a
      # tighter timeout — is the fix. The wall clock this cost is recovered above,
      # by sharding (more runners) and the compile cache (the follow-up this note
      # used to point at) — NOT by raising -n, which would just OOM again.
      #
      # `--timeout=600 --timeout-method=thread` still guards the OTHER tail
      # failure mode: a single test that genuinely hangs (cold compile / deadlock)
      # stalls its worker while the others finish; the per-test cap converts that
      # into a fast, named failure (10 min ≫ any healthy test — all run < 150 s
      # locally) instead of a silent job-timeout.
      - run: |
          pytest ${{ matrix.paths }} -q \
            -n 2 \
            --timeout=600 --timeout-method=thread \
            --ignore=tests/crossval \
            --ignore=tests/regression/paper/test_draine2021_pah_loader.py \
            --ignore=tests/regression/synthesizer_parity/test_nebular_continuum.py \
            --ignore=tests/regression/synthesizer_parity/test_nebular_fesc.py
        # 20 -> 35. #1146 committed the SSP grids, which turned ~36 previously-
        # SKIPPED tests ON (main was 1418 passed / 85 skipped; now 1454 / 49). They
        # are the expensive kind — real 5994-wavelength grids, Cue builds — and the
        # `contract` shard, already the long pole, went from ~11 min to ~21 min. It
        # passed at 18m24s on the PR branch and was KILLED at 21m29s on main: the
        # margin was gone and runner variance ate it.
        #
        # This is more work getting done, not slower work: a data-gated test that
        # skips on CI has zero coverage, which is the whole reason the grids are now
        # committed. Give the shard headroom rather than un-cover 36 tests.
        #
        # The per-test `--timeout=600` above still guards the failure mode this
        # number does NOT: a single hung test stalling a worker.
        timeout-minutes: 35
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/tengri_jax_cache
          key: ${{ steps.jax_cache.outputs.cache-primary-key }}

  # Full-suite coverage → Codecov, WITHOUT slowing PR feedback. Runs on
  # push-to-main, the nightly schedule, and manual dispatch — not on PRs.
  #
  # SHARDED, across the same three trees the `test` job uses (2026-07). This job ran
  # the entire fast tier in ONE process under coverage instrumentation, and it does
  # not fit in any sane cap:
  #
  #   test shards on main:  contract ~26 min + components ~11 + physics-regression ~11
  #                         = ~48 min of work, and --cov adds a further 30-50%
  #
  # so it needs 70-80 min in a single job. It timed out at 35 (#1153), then at 50
  # (#1156, mine), and each bump only moved the wall — main stayed red both times.
  #
  # I argued against sharding this job on the grounds that its wall clock is off the
  # PR feedback path, so splitting buys no latency. That was the wrong frame: the cap
  # is not a latency question when the work does not FIT. And the reason I gave for
  # not splitting — "merging partial coverage reports is real machinery" — is simply
  # false: Codecov merges multiple uploads for the same commit natively. There is no
  # machinery. Three shards, three uploads, one merged report.
  #
  # Flags let Codecov attribute coverage per tree, which is a bonus, not a
  # requirement — the merge happens regardless.
  coverage:
    runs-on: ubuntu-latest
    needs: smoke
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: contract
            paths: tests/contract
          - shard: components
            paths: tests/components
          - shard: physics-regression
            paths: tests/physics tests/regression
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # `-n 2` (not `-n auto`): `--cov` adds ~30–50 % memory on top of the test
      # job, so this job OOM-killed the runner even more often than `test`
      # (the dominant cause of red `main`). Sharding does not change peak RSS per
      # runner — each shard still runs at -n 2 — it only stops one runner from having
      # to carry the whole tier.
      - run: |
          pytest ${{ matrix.paths }} -q \
            -n 2 \
            --cov=src/tengri --cov-report=xml --cov-report=term:skip-covered \
            --ignore=tests/crossval \
            --ignore=tests/regression/paper/test_draine2021_pah_loader.py \
            --ignore=tests/regression/synthesizer_parity/test_nebular_continuum.py \
            --ignore=tests/regression/synthesizer_parity/test_nebular_fesc.py
        timeout-minutes: 50
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: ${{ matrix.shard }}
          fail_ci_if_error: false
        continue-on-error: true

  # Sampler-heavy inference tests (NUTS, Pathfinder, VI, MCLMC, etc.).
  # Run on:
  #   - nightly schedule
  #   - manual workflow_dispatch
  #   - PRs labeled `run-slow-tests`
  # Skip on regular push/PR to keep fast feedback under 15 min.
  slow:
    runs-on: ubuntu-latest
    # Split the ~1,270-test tier across two parallel runners (one per suite):
    # run serially, the combined tier overran the 40-min step timeout (~55 %
    # done), so it never completed and its failure summary was never printed.
    # A single suite finishes well under the budget. Kept serial (no `-n`):
    # the sampler-heavy inference tests (NUTS/VI warmups) peak at several GB
    # each, so xdist workers would risk OOM on the 16 GB runner. `fail-fast:
    # false` so one suite's failure still lets the other report.
    strategy:
      fail-fast: false
      matrix:
        # Per-suite step budgets sized to the measured serial runtimes:
        # inference ≈ 51 min; integration has grown from ≈ 93 min to 114–118
        # min on recent main runs (b11f4d36/21b41836/44725252) and timed out
        # at 120 on #955 — budget re-sized with headroom. The real fix is
        # pruning/parallelizing the integration tier, not more budget.
        # Kept serial (no xdist) for OOM safety, so each suite needs a budget
        # above its own runtime rather than a shared 40-min cap.
        include:
          - suite: inference
            timeout: 60
          - suite: integration
            timeout: 180
    # Own concurrency group per suite: do NOT inherit the workflow-level
    # `cancel-in-progress: true` (which kills slow whenever main moves).
    # `cancel-in-progress: false` means newer slow triggers queue behind
    # an existing one — slow always runs to completion, never aborted by
    # an unrelated main push. See issue #160.
    concurrency:
      group: tests-slow-${{ matrix.suite }}-${{ github.ref }}
      cancel-in-progress: false
    if: |
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-slow-tests'))
    timeout-minutes: 185
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Persist the JAX/XLA compilation cache across slow-tier runs.
      # `import tengri` auto-enables the on-disk cache
      # (~/.cache/tengri_jax_cache), but ephemeral runners start cold, so
      # every run re-paid the full VI/geoVI compile bill (the majority of
      # tests/inference wall-clock). Entries are keyed internally by
      # jaxlib version + XLA program hash, so a stale restore after a JAX
      # upgrade is a harmless miss, never a wrong hit. The run-id key with
      # prefix restore-keys implements an append-only cache: each run
      # restores the newest snapshot and saves its own superset.
      #
      # restore + save(if: always()), NOT the combined `actions/cache`: the
      # combined action's implicit post-save is SKIPPED when the job fails,
      # and this tier is red (#1031). A cache meant to speed up a failing
      # suite can never warm if warming requires the suite to pass — the
      # same trap that made the `test` job's cache a no-op (see its comment).
      - uses: actions/cache/restore@v4
        id: jax_cache
        with:
          path: ~/.cache/tengri_jax_cache
          key: tengri-jax-${{ matrix.suite }}-${{ hashFiles('pyproject.toml') }}-${{ github.run_id }}
          restore-keys: |
            tengri-jax-${{ matrix.suite }}-${{ hashFiles('pyproject.toml') }}-
      # `-m 'not crossval'` overrides the default addopts selector, which
      # deselects the `slow` marker that conftest auto-applies to exactly these
      # two trees — without it this job would collect everything and run nothing.
      # `-n 0` keeps the tier serial: the default addopts now request `-n auto`,
      # but the sampler-heavy tests peak at several GB each and xdist workers
      # would OOM the 16 GB runner (the reason this tier was never parallelized).
      - run: pytest tests/${{ matrix.suite }} -q --ignore=tests/crossval -m 'not crossval' -n 0
        timeout-minutes: ${{ matrix.timeout }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/tengri_jax_cache
          key: ${{ steps.jax_cache.outputs.cache-primary-key }}
