name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Nightly slow-tier run at 04:00 UTC (mid-afternoon Tokyo).
    - cron: "0 4 * * *"
  workflow_dispatch:

# Cancel older runs of this workflow on the same ref when a new push lands.
# Saves compute when commits land back-to-back.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Skip the heavy jobs on bare `labeled` PR events. GitHub fires one `labeled`
# webhook PER label added, so labelling a PR with N labels used to spawn N
# duplicate workflow runs that immediately cancelled each other under
# `cancel-in-progress` (and occasionally killed the surviving run mid-suite).
# Only the `slow` job cares about labels (`run-slow-tests`); everything else
# should run on push / opened / synchronize / reopened, not on label adds.
jobs:
  lint:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'labeled' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install "ruff==0.15.6"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: python tools/add_spdx_headers.py --check

  # Static security scan + dependency vulnerability check. Informational
  # for now (continue-on-error) — surfaces findings in the PR check UI
  # without blocking. Promote to required once the baseline is clean.
  security:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'labeled' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install bandit pip-audit
      - name: Static security scan (bandit, high severity)
        run: bandit -r src/ -ll
        continue-on-error: true
      - name: Install for dependency audit
        run: pip install -e .
      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit --disable-pip
        continue-on-error: true

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'labeled' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python tools/check_param_prefixes.py
      - run: python tools/check_test_markers.py
      - run: pytest tests/components/sps/test_alpha_fe.py tests/components/stellar/test_stellar_skeleton.py -q --no-header

  test:
    runs-on: ubuntu-latest
    needs: smoke
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'labeled' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Persist the tengri JAX compile cache across CI runs. `import tengri`
      # auto-enables an on-disk cache at $TENGRI_JAX_CACHE_DIR; caching it keyed
      # on the source hash lets re-runs (and unchanged kernels across commits via
      # restore-keys) skip the expensive first-compile of geoVI/MGVI/per-filter
      # kernels. See docs/installation.md and src/tengri/__init__.py.
      - name: Cache JAX compile cache
        uses: actions/cache@v4
        with:
          path: .jax_cache
          key: jax-cache-${{ runner.os }}-py3.12-${{ hashFiles('src/tengri/**/*.py', 'pyproject.toml') }}
          restore-keys: |
            jax-cache-${{ runner.os }}-py3.12-
      # Match the pre-rehome scope: fast tests only.
      # tests/integration/ and tests/crossval/ are gated; the new
      # physics-first tree (components/, contract/, inference/,
      # physics/, regression/) sits alongside the legacy tests/unit/
      # subdirs and runs in the same fast-suite scope.
      # tests/inference/ is excluded from fast CI: many files do real
      # MAP/VI/MCMC fits and individually push runtime past 15 min.
      # Re-introduce via a slow-tier job in a follow-up PR.
      #
      # Two missing-fixture files remain skipped; the three numerical
      # / autodiff failures the rehome surfaced were fixed in the same
      # PR that removed the --deselect lines.
      #
      # pytest-xdist `-n auto` runs tests in parallel across all CPU cores on
      # the GitHub runner (typically 4 vCPUs). Gives ~2-3x wall-clock speedup
      # on the ~5800-test fast suite.
      - run: |
          pytest tests/components tests/contract tests/physics tests/regression -q \
            -n auto \
            --cov=src/tengri --cov-report=xml --cov-report=term:skip-covered \
            --ignore=tests/crossval \
            --ignore=tests/regression/paper/test_draine2021_pah_loader.py \
            --ignore=tests/regression/synthesizer_parity/test_nebular_continuum.py \
            --ignore=tests/regression/synthesizer_parity/test_nebular_fesc.py
        env:
          TENGRI_JAX_CACHE_DIR: ${{ github.workspace }}/.jax_cache
        # 25 min (was 15): headroom for cold-cache runs so a slightly-slow suite
        # is not cancelled mid-flight. The xdist `-n auto` fast suite is ~12-13 min.
        timeout-minutes: 25
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  # Sampler-heavy inference tests (NUTS, Pathfinder, VI, MCLMC, etc.).
  # Run on:
  #   - nightly schedule
  #   - manual workflow_dispatch
  #   - PRs labeled `run-slow-tests`
  # Skip on regular push/PR to keep fast feedback under 15 min.
  slow:
    runs-on: ubuntu-latest
    # Own concurrency group: do NOT inherit the workflow-level
    # `cancel-in-progress: true` (which kills slow whenever main moves).
    # `cancel-in-progress: false` means newer slow triggers queue behind
    # an existing one — slow always runs to completion, never aborted by
    # an unrelated main push. See issue #160.
    concurrency:
      group: tests-slow-${{ github.ref }}
      cancel-in-progress: false
    if: |
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-slow-tests'))
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest tests/inference tests/integration -q --ignore=tests/crossval
        timeout-minutes: 40
