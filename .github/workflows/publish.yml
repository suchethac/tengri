name: Publish to PyPI

# Triggers only when a GitHub Release is published. Build the sdist + wheel
# and upload via PyPI Trusted Publishers (OIDC; no API token in repo secrets).
#
# Setup checklist (one-time, before the first real release):
#   1. https://pypi.org/manage/account/publishing/ → "Add a new pending publisher"
#      - PyPI Project Name: astro-tengri
#      - Owner: tengri-project   (after the org transfer; until then: suchethac)
#      - Repository name: tengri
#      - Workflow name: publish.yml
#      - Environment name: pypi
#   2. In repo Settings → Environments → New: "pypi" (no required reviewers
#      needed for first run; can add later)
#   3. (Recommended) Do a dry run on TestPyPI first by creating a pre-release
#      tag (e.g. v0.1.0a1) — TestPyPI uses a separate Trusted Publisher.
#      Add a duplicate workflow `publish-testpypi.yml` if desired.

on:
  release:
    types: [published]
  workflow_dispatch:  # allow manual trigger from Actions UI

permissions:
  contents: read

# dsps sdists build via setuptools-scm, which raises in the fresh pip
# build-isolation env without a .git checkout; stamp a version so the build
# succeeds (matches tests.yml; see #798).
env:
  SETUPTOOLS_SCM_PRETEND_VERSION_FOR_DSPS: "0.4.7"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build backend
        run: python -m pip install --upgrade build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Validate distribution metadata
        run: twine check --strict dist/*

      # `twine check` validates metadata and never installs anything, and
      # `smoke` in tests.yml uses `pip install -e`, which imports straight from
      # the source tree. So nothing anywhere exercised the built wheel: a
      # missing package-data glob, or an import that only resolves from a
      # checkout, would have surfaced for the first time at release — after the
      # artifact is public and the version number is spent, and PyPI does not
      # allow re-uploading a version (#1818).
      #
      # Installed into a clean venv and imported from outside the checkout, so
      # `src/` cannot satisfy the import and mask the very failure being
      # checked.
      - name: Install the built wheel and import it
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install --quiet --upgrade pip
          /tmp/wheel-check/bin/pip install --quiet dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/python -c "
          import pathlib, tengri
          print('imported tengri', tengri.__version__, 'from', tengri.__file__)
          root = pathlib.Path(tengri.__file__).parent
          data = [p for p in root.rglob('*') if p.is_file() and p.suffix not in {'.py', '.pyc'}]
          print(f'{len(data)} non-.py package data file(s) present')
          assert data, 'no package data in the wheel - check [tool.setuptools.package-data]'
          "

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/astro-tengri
    permissions:
      contents: read
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
