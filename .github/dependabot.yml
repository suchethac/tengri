version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "monthly"
    labels: ["area:ci", "full-tests"]
    groups:
      jax:
        patterns: ["jax", "jaxlib"]
      ci-tools:
        patterns: ["*"]
        exclude-patterns: ["jax", "jaxlib"]
